<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Question Bank by SundarSTEM</title>
<script>
  // MathJax v3 does NOT recognize single-$ inline math by default (only
  // \(...\) ) -- every prompt/option/LaTeX-guide in this app tells teachers
  // to write $x^2$, which was silently never rendering. This config must
  // load before the MathJax library script below.
  window.MathJax = {
    tex: { inlineMath: [['$','$'], ['\\(','\\)']], displayMath: [['$$','$$'], ['\\[','\\]']] },
    options: { skipHtmlTags: ['script','noscript','style','textarea','pre'] }
  };
</script>
<!-- SVG output (not the default CHTML combo), fixed Oct 2026: html2canvas
     ghosted/doubled every equation it captured regardless of scale/option
     tweaks (confirmed: the live page rendered perfectly, only the
     html2canvas-captured canvas was corrupted) -- a known html2canvas
     incompatibility with MathJax's deeply-nested inline layout, CHTML or
     SVG output alike. The real fix is flattenMathToImages() in
     downloadQuestionImage() converting rendered math to plain <img>
     elements before capture, which needs actual <svg> elements to
     serialize -- CHTML's font-glyph output has no equivalent. -->
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@400;600&family=Noto+Naskh+Arabic:wght@400;600&display=swap');

  :root{
    --bg:#f7f4ec; --surface:#fffdf8; --surface-2:#eee8da; --border:#e0d8c4; --ink:#221e17; --ink-dim:#6b6355;
    --accent:#0f6b5c; --accent-ink:#ffffff; --accent-soft:#e2efe9; --gold:#b5791f; --gold-soft:#f6ecd9;
    --red:#a4372b; --red-soft:#f7e3df; --blue:#2f5f8a; --blue-soft:#e4edf5; --violet:#6a5a9e; --violet-soft:#e9e5f3;
    --brown:#8a5a2e; --brown-soft:#efe2d0;
    --shadow: 0 1px 2px rgba(20,30,25,0.06), 0 6px 20px -10px rgba(20,30,25,0.18);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161c15; --surface:#1c231b; --surface-2:#232d24; --border:#333f34; --ink:#e9efe9; --ink-dim:#9db0a5;
      --accent:#3fae95; --accent-ink:#0a1512; --accent-soft:#1c3630; --gold:#d9a34a; --gold-soft:#332711;
      --red:#e07463; --red-soft:#3a1f1a; --blue:#7fb0dd; --blue-soft:#1c2c39; --violet:#b3a3e0; --violet-soft:#2a2440;
      --brown:#c99a63; --brown-soft:#3a2d1c;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 30px -12px rgba(0,0,0,0.55);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#161c15; --surface:#1c231b; --surface-2:#232d24; --border:#333f34; --ink:#e9efe9; --ink-dim:#9db0a5;
    --accent:#3fae95; --accent-ink:#0a1512; --accent-soft:#1c3630; --gold:#d9a34a; --gold-soft:#332711;
    --red:#e07463; --red-soft:#3a1f1a; --blue:#7fb0dd; --blue-soft:#1c2c39; --violet:#b3a3e0; --violet-soft:#2a2440;
    --brown:#c99a63; --brown-soft:#3a2d1c;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 30px -12px rgba(0,0,0,0.55);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; }
  body{
    background:var(--bg); color:var(--ink); font-family:'Public Sans', system-ui, sans-serif; font-size:14px; line-height:1.5;
  }
  h1,h2,h3,.disp{ font-family:'Lexend', system-ui, sans-serif; text-wrap:balance; }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  a{color:var(--accent);}
  button{ font-family:inherit; cursor:pointer; }
  input,select,textarea{ font-family:inherit; font-size:13px; color:var(--ink); background:var(--surface); border:1px solid var(--border); border-radius:7px; padding:8px 10px; }
  input:focus,select:focus,textarea:focus,button:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .app{ display:flex; min-height:100vh; }
  .sidebar{ width:216px; flex:0 0 216px; background:var(--surface); border-right:1px solid var(--border); padding:20px 14px; display:flex; flex-direction:column; gap:22px; position:sticky; top:0; height:100vh; }
  .brand{ display:flex; align-items:center; gap:9px; padding:0 6px; }
  .brand .mark{ width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink); display:flex;align-items:center;justify-content:center;font-family:'Lexend';font-weight:700;font-size:13px;flex:0 0 auto; }
  .logo-mark{ background:transparent !important; object-fit:contain; }
  .brand .name{ font-family:'Lexend'; font-weight:600; font-size:14.5px; line-height:1.2; }
  .brand .sub{ font-size:10.5px; color:var(--ink-dim); letter-spacing:.02em; }
  .nav{ display:flex; flex-direction:column; gap:2px; }
  .nav button{ all:unset; cursor:pointer; padding:9px 10px; border-radius:7px; font-size:13px; font-weight:500; color:var(--ink-dim); display:flex; align-items:center; gap:9px; }
  .nav button[hidden]{ display:none; }
  .nav button:hover{ background:var(--surface-2); color:var(--ink); }
  .nav button.active{ background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .nav .dot{ width:6px;height:6px;border-radius:50%; background:currentColor; opacity:.55; flex:0 0 auto; }
  .nav-badge{ width:8px; height:8px; border-radius:50%; background:var(--red); display:inline-block; margin-left:auto; flex:0 0 auto; }
  .mobile-tabbar button .nav-badge{ margin-left:5px; }
  .side-foot{ margin-top:auto; padding:10px; border-top:1px solid var(--border); font-size:11.5px; color:var(--ink-dim); }
  .who{ display:flex; align-items:center; gap:8px; }
  .who img{ width:24px;height:24px;border-radius:50%; }
  .who b{ color:var(--ink); font-weight:600; display:block; font-size:12px; }
  .link-btn{ all:unset; cursor:pointer; color:var(--accent); font-size:11.5px; }
  .main-col{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }
  .main{ padding:26px 32px 60px; max-width:1180px; }
  .content-row{ display:flex; align-items:flex-start; }
  .content-row .main{ flex:1 1 auto; min-width:0; }
  .insights-rail{ width:300px; flex:0 0 300px; padding:26px 32px 40px 0; display:flex; flex-direction:column; gap:14px; }
  .insights-rail:empty{ display:none; }
  .insights-rail .dash-chart-card{ margin-bottom:0; }
  .insights-rail .dash-chart-card b{ font-size:12.5px; }
  /* Thick horizontal bars (~5mm/19px) for the compact "Your assignments"
     widget -- one row per level, click to expand into per-chapter rows. */
  .hbar-row{ all:unset; display:flex; align-items:center; gap:8px; width:100%; cursor:pointer; padding:5px 0; }
  .hbar-row.sub{ padding-left:14px; cursor:default; }
  .hbar-label{ flex:0 0 52px; font-size:11.5px; font-weight:700; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hbar-row.sub .hbar-label{ flex-basis:96px; font-weight:500; font-size:10.5px; }
  .hbar-track{ display:block; flex:1 1 auto; height:19px; border-radius:5px; background:var(--surface-2); overflow:hidden; min-width:0; }
  .hbar-row.sub .hbar-track{ height:13px; }
  .hbar-fill{ display:block; height:100%; background:var(--accent); border-radius:5px; transition:width .5s cubic-bezier(.16,1,.3,1); }
  .hbar-value{ flex:0 0 auto; font-size:11px; color:var(--ink-dim); font-family:'IBM Plex Mono', monospace; min-width:44px; text-align:right; }
  .hbar-chevron{ flex:0 0 auto; font-size:10px; color:var(--ink-dim); width:10px; }
  @media (max-width:1400px){
    .content-row{ flex-direction:column; }
    .insights-rail{ width:100%; flex:0 0 auto; padding:0 32px 18px; flex-direction:row; flex-wrap:wrap; }
    .insights-rail .dash-chart-card{ flex:1 1 230px; }
  }
  @media (max-width:760px){
    .insights-rail{ padding:0 16px 14px; }
  }
  #gamify-bar:empty{ display:none; }
  .gamify-strip{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; padding:10px 32px; background:var(--surface); border-bottom:1px solid var(--border); font-size:12.5px; }
  .gamify-strip .streak{ font-weight:700; color:var(--gold); white-space:nowrap; }
  .gamify-strip .g-metric{ display:flex; align-items:center; gap:7px; white-space:nowrap; }
  .gamify-strip .g-metric b{ font-size:13px; }
  .gamify-strip .g-metric .progress-bar{ width:100px; height:9px; background:var(--border); }
  .gamify-strip .g-metric .progress-bar-fill{ background:var(--accent); }
  .gamify-strip .g-metric .progress-bar-fill.over-target{ background:var(--gold); }
  .gamify-strip .g-cmp{ margin-left:auto; color:var(--ink-dim); white-space:nowrap; }
  @media (max-width:760px){
    .gamify-strip{ padding:8px 16px; gap:10px; font-size:11.5px; }
    .gamify-strip .g-metric .progress-bar{ width:64px; }
    .gamify-strip .g-cmp{ display:none; }
  }
  .pagehead{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:4px; padding-top:10px; border-top:3px solid transparent; flex-wrap:wrap;}
  [data-section="contests"] .pagehead{ border-top-color:var(--blue); }
  [data-section="quilgo"] .pagehead{ border-top-color:var(--gold); }
  [data-section="workload"] .pagehead{ border-top-color:var(--violet); }
  .pagehead h1{ font-size:21px; font-weight:700; margin:0; }
  .pagehead .desc{ color:var(--ink-dim); font-size:13px; margin:4px 0 20px; max-width:66ch; }
  .btn{ display:inline-flex; align-items:center; gap:6px; border-radius:7px; border:1px solid var(--border); background:var(--surface); padding:8px 13px; font-size:13px; font-weight:600; color:var(--ink); }
  .btn:hover{ border-color:var(--accent); }
  .btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .btn.primary:hover{ filter:brightness(1.06); }
  .btn.ghost{ background:transparent; border-color:transparent; color:var(--ink-dim); }
  .btn.ghost:hover{ background:var(--surface-2); color:var(--ink); }
  .btn.small{ padding:5px 9px; font-size:12px; }
  .btn:disabled{ opacity:.65; cursor:default; }
  .spinner{ display:inline-block; width:13px; height:13px; border-radius:50%; border:2px solid rgba(255,255,255,.4); border-top-color:currentColor; animation:spin .7s linear infinite; vertical-align:-2px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .filters{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:18px; padding:12px; background:var(--surface); border:1px solid var(--border); border-radius:10px; }
  .filter-chips{ display:flex; flex-wrap:wrap; gap:7px; margin:-10px 0 16px; }
  .filter-chip{ display:inline-flex; align-items:center; gap:5px; background:var(--accent-soft); color:var(--accent); border:none; border-radius:999px; padding:4px 6px 4px 11px; font-size:12px; font-weight:600; }
  .filter-chip button{ all:unset; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; border-radius:50%; font-weight:700; }
  .filter-chip button:hover{ background:rgba(0,0,0,.08); }
  .filter-chip.clear-all{ background:var(--surface-2); color:var(--ink-dim); cursor:pointer; padding:4px 12px; }
  .filter-chip.clear-all:hover{ color:var(--ink); }
  .filters .search{ flex:1 1 180px; min-width:150px; }
  .filters .count{ margin-left:auto; font-size:12px; color:var(--ink-dim); white-space:nowrap; }
  .pill{ display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; letter-spacing:.01em; border:none; }
  button.pill{ cursor:pointer; }
  button.pill:hover{ filter:brightness(0.93); }
  .link-quickfilter{ all:unset; cursor:pointer; }
  .link-quickfilter:hover{ text-decoration:underline; }
  .skills-chip-wrap{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .pill.skill-chip{ background:var(--surface-2); color:var(--ink-dim); border:1px solid var(--border); }
  .pill.skill-chip.on{ background:var(--violet-soft); color:var(--violet); border-color:var(--violet); }
  .pill.level{ background:var(--blue-soft); color:var(--blue); }
  .pill.type{ background:var(--accent-soft); color:var(--accent); }
  .diff-dots{ font-size:7px; letter-spacing:1.5px; margin-left:2px; }
  .pill.diff-medium{ background:var(--gold-soft); color:var(--gold); }
  .pill.diff-hard{ background:#f3e3d4; color:#a15a1e; }
  .pill.diff-very_hard{ background:var(--red-soft); color:var(--red); }
  .pill.status-draft{ background:var(--surface-2); color:var(--ink-dim); }
  .pill.status-in_review{ background:var(--blue-soft); color:var(--blue); }
  .pill.status-finalized{ background:var(--accent-soft); color:var(--accent); }
  .pill.status-uploaded{ background:#0f6b5c; color:#fff; }
  :root:not([data-theme="light"]) .pill.status-uploaded{ background:#1a2e27; color:#7ee0c4; }
  .pill.role-admin{ background:var(--accent-soft); color:var(--accent); }
  .pill.role-teacher{ background:var(--surface-2); color:var(--ink-dim); }
  .pill.role-qb_lead{ background:var(--blue-soft); color:var(--blue); }
  .pill.role-external_reviewer{ background:var(--violet-soft); color:var(--violet); }
  .pill.role-uploader{ background:var(--gold-soft); color:var(--gold); }
  .pill.role-automation{ background:var(--brown-soft); color:var(--brown); }
  .progress-bar{ height:8px; border-radius:999px; background:var(--surface-2); overflow:hidden; }
  .progress-bar-fill{ height:100%; background:linear-gradient(90deg, var(--accent-soft), var(--accent)); border-radius:999px; transition:width .7s cubic-bezier(.16,1,.3,1); }
  .progress-card{ border:1px solid var(--border); border-radius:9px; padding:12px 14px; margin-bottom:10px; }
  .progress-card .row{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:6px; }
  .checklist{ display:flex; flex-direction:column; gap:6px; font-size:12.5px; }
  .checklist label{ display:flex; align-items:flex-start; gap:7px; font-weight:400; }
  .drawer.wide{ width:min(980px, 94vw); }
  #live-preview{ background:#fff; color:#161b19; border-radius:8px; padding:4px; border:1px solid var(--border); }
  #drawer-preview{ background:#fff; color:#161b19; border-radius:8px; padding:10px; border:1px solid var(--border); }
  #live-preview .hint{ color:#6b7280; }
  .callout{ background:var(--accent-soft); color:var(--ink); border-left:3px solid var(--accent); padding:8px 11px; border-radius:6px; font-size:12px; line-height:1.5; margin-top:6px; }
  .callout.warn{ background:var(--gold-soft); border-left-color:var(--gold); }

  /* ---- engagement: likes, comment/like/rate summary ---- */
  .engagement-summary{ font-size:12px; color:var(--ink-dim); margin-top:6px; letter-spacing:.01em; }
  .like-btn{ background:var(--surface-2); border-color:var(--border); color:var(--ink-dim); font-weight:600; }
  .like-btn.on{ background:var(--red-soft); color:var(--red); border-color:var(--red); }

  /* ---- "Recently posted" feed (Bank tab) ---- */
  .recent-activity-list{ display:flex; flex-direction:column; gap:3px; margin-top:8px; }
  .recent-activity-item{ all:unset; display:flex; justify-content:space-between; align-items:center; gap:14px; padding:11px 12px; border-radius:9px; border:1px solid var(--border); background:var(--surface); cursor:pointer; font-size:13px; }
  .recent-activity-item:hover{ background:var(--surface-2); border-color:var(--accent); }
  .recent-activity-item .qtitle{ font-weight:600; }

  /* ---- admin activity log ---- */
  .activity-log{ display:flex; flex-direction:column; }
  .activity-row{ display:flex; align-items:baseline; gap:10px; padding:9px 4px; border-bottom:1px solid var(--border); font-size:13px; }
  .activity-row:last-child{ border-bottom:none; }
  .activity-icon{ flex:0 0 auto; }
  .activity-summary{ flex:1; min-width:0; }
  .activity-meta{ flex:0 0 auto; font-size:11.5px; color:var(--ink-dim); white-space:nowrap; }

  /* ---- assignment board: level tabs + Kanban drag-and-drop ---- */
  .level-tabs{ display:flex; gap:4px; border-bottom:1px solid var(--border); margin:14px 0 12px; }
  .level-tabs button{ padding:8px 14px; font-size:13px; font-weight:600; color:var(--ink-dim); border-radius:8px 8px 0 0; border:1px solid transparent; background:transparent; }
  .level-tabs button.active{ color:var(--accent); border-color:var(--border); border-bottom-color:var(--surface); background:var(--surface); }
  .kanban-board{ display:flex; gap:12px; overflow-x:auto; padding-bottom:6px; }
  .kanban-col{ flex:0 0 220px; background:var(--surface-2); border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:8px; min-height:120px; }
  .kanban-col-head{ font-weight:700; font-size:12.5px; padding:0 2px 6px; border-bottom:1px solid var(--border); }
  .kanban-add-select{ width:100%; font-size:11.5px; padding:5px 6px; }
  .kanban-cards{ display:flex; flex-direction:column; gap:7px; min-height:60px; border-radius:8px; transition:background .15s; }
  .kanban-cards.drag-over{ background:var(--accent-soft); outline:2px dashed var(--accent); }
  .kanban-card{ background:var(--surface); border:1px solid var(--border); border-radius:7px; padding:8px 9px; cursor:grab; display:flex; flex-direction:column; gap:5px; box-shadow:var(--shadow); }
  .kanban-card.dragging{ opacity:.4; }
  .kanban-card-title{ font-size:12.5px; font-weight:600; line-height:1.35; }
  .kanban-card-count{ width:56px; padding:3px 5px; font-size:12px; align-self:flex-end; }
  .kanban-empty{ font-size:11.5px; color:var(--ink-dim); text-align:center; padding:14px 4px; border:1px dashed var(--border); border-radius:7px; }

  /* ---- workload dashboard: charts + drill-down ---- */
  .dash-charts{ display:grid; grid-template-columns:2fr 1fr; gap:14px; margin-bottom:8px; }
  .dash-chart-card{ background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:14px 16px; box-shadow:var(--shadow); }
  .dash-chart-card-donut{ display:flex; flex-direction:column; align-items:center; text-align:center; }
  .chart-svg{ width:100%; height:auto; display:block; margin-top:6px; }
  .chart-svg.donut{ width:148px; margin:10px auto 0; }
  /* A .bar-* class's `fill` (needed so the same classes paint solid <rect>
     bars and <span class="swatch"> legend dots) otherwise beats a circle's
     own fill="none" attribute -- CSS always wins over a presentation
     attribute -- which silently filled the whole donut hole with whichever
     segment was drawn last instead of leaving a clean ring. */
  .chart-svg.donut circle{ fill:none; }
  /* Oct 2026 recolor: status colors now match what's asked for everywhere
     this chart appears (legends, the per-teacher grouped bars) -- draft=red,
     in review=brown, reviewed=green(accent), locked=blue. Swapped from the
     original draft=blue/in-review=gold/reviewed=violet/locked=accent
     mapping; violet is now free and reused for the separate "reviews done"
     (reviewer workload, not authoring status) bar below. */
  .bar-done{ fill:var(--blue); stroke:var(--blue); background:var(--blue); }
  .bar-inreview{ fill:var(--brown); stroke:var(--brown); background:var(--brown); }
  .bar-draft{ fill:var(--red); stroke:var(--red); background:var(--red); }
  .bar-remaining{ fill:var(--border); stroke:var(--border); background:var(--border); }
  .bar-disagree{ fill:var(--red); stroke:var(--red); background:var(--red); }
  .bar-reviewed{ fill:var(--accent); stroke:var(--accent); background:var(--accent); }
  .bar-reviewsdone{ fill:var(--violet); stroke:var(--violet); background:var(--violet); }
  .chart-value-label{ font-size:10.5px; fill:var(--ink-dim); font-variant-numeric:tabular-nums; }
  .chart-axis-label{ font-size:12px; font-weight:600; fill:var(--ink-dim); }
  .donut-center-value{ font-size:20px; font-weight:600; fill:var(--ink); }
  .donut-center-label{ font-size:10px; fill:var(--ink-dim); text-transform:uppercase; letter-spacing:.05em; }
  .chart-legend{ display:flex; flex-wrap:wrap; gap:10px 14px; margin-top:10px; font-size:11.5px; color:var(--ink-dim); }
  .chart-legend span{ display:inline-flex; align-items:center; gap:5px; }
  .swatch{ width:9px; height:9px; border-radius:2px; display:inline-block; }
  .level-cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-top:10px; }
  .level-card{ all:unset; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px; cursor:pointer; box-shadow:var(--shadow); }
  .level-card:hover{ border-color:var(--accent); }
  .level-card.active{ border-color:var(--accent); background:var(--accent-soft); }
  .level-card-head{ font-family:'Lexend'; font-weight:700; font-size:15px; }
  .teacher-roster{ display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .teacher-roster-row{ all:unset; display:flex; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:9px 12px; cursor:pointer; font-size:13px; }
  .teacher-roster-row:hover{ border-color:var(--accent); background:var(--surface-2); }
  .teacher-roster-name{ font-weight:600; flex:0 0 auto; min-width:120px; }
  .records-details summary::-webkit-details-marker{ display:none; }

function allSkills(){

// Every distinct author actually present in the bank, for the "Author"
// filter -- not allTeachers, since that would also list people who have
// never posted a question (nothing to filter by) and wouldn't label an
// old post by someone since removed from the roster.
function allAuthors(){
  const seen = new Map();
  questions.forEach(q=>{ if(q.authorEmail && !seen.has(q.authorEmail)) seen.set(q.authorEmail, q.authorName||q.authorEmail); });
  return Array.from(seen.entries()).sort((a,b)=>a[1].localeCompare(b[1]));
}
// Which status values a role may pick in the editor. The question's current
// value is always included even if not normally pickable by this role, so
// re-saving never silently downgrades a status someone else set.
function allowedStatusOptions(currentStatus, peerReview){
  let allowed = isAdminUser ? STATUSES
    : canFinalize ? STATUSES.filter(s=>s.v!=="uploaded")
    : STATUSES.filter(s=>s.v==="draft"||s.v==="in_review");
  // Locking requires an independent reviewer to have actually solved the
  // question and agreed with the marked answer first -- applies to every
  // role, admin included, since the whole point is catching a wrong/
  // ambiguous answer before it reaches a contest. Checked with `?.` (not
  // `peerReview &&`) so a question with NO peerReview yet -- e.g. a
  // brand-new question, or any question never moved to "in_review" -- is
  // blocked too, not just one with an active disagreement.
  if(peerReview?.outcome!=="agree") allowed = allowed.filter(s=>s.v!=="finalized");
  if(currentStatus && !allowed.some(s=>s.v===currentStatus)){
    allowed = [...allowed, STATUSES.find(s=>s.v===currentStatus)];
  }
  return allowed;
}

// below at a sensible default font-size/line-height, so the tab works
// correctly on a brand-new install with zero setup, same pattern as
// dailyLimits above.
let sopData = null;

function allCurriculum(){
  const merged = CURRICULUM.map(b=>({...b, chapters:[...b.chapters]}));
  // Two passes, not one -- curriculumExtra comes from an unordered
  // collection() query (no orderBy), so there's no guarantee a custom
  // book's own "book" doc is iterated before its "chapter" docs. A chapter
  // processed first used to find no matching book yet in `merged` and get
  // silently dropped by the `if(b)` guard below -- e.g. adding a book then
  // several chapters to it could show only whichever chapters happened to
  // sort after the book doc, not all of them.
  curriculumExtra.forEach(doc=>{
    if(doc.type==="book") merged.push({bookId:doc.bookId, levels:doc.levels||[], age:doc.age||"", book:doc.bookName, chapters:(doc.chapters||[]).slice(), custom:true});
  });
  curriculumExtra.forEach(doc=>{
    if(doc.type==="chapter"){
      const b = merged.find(x=>x.bookId===doc.bookId);
      if(b) b.chapters.push({code:doc.code, title:doc.title, subtopics:doc.subtopics||[], custom:true});
    }
  });
  // Third pass: a "subtopic" extra appends one subtopic to an EXISTING
  // chapter (hardcoded Beast Academy or custom) -- any content-teacher can
  // create these (see firestore.rules), not just admins, so a chapter's
  // subtopic list can grow collaboratively without ever touching the
  // hardcoded CURRICULUM data itself.
  curriculumExtra.forEach(doc=>{
    if(doc.type==="subtopic"){
      const c = merged.flatMap(b=>b.chapters).find(x=>x.code===doc.chapterCode);
      if(c && !c.subtopics.includes(doc.subtopic)) c.subtopics.push(doc.subtopic);
    }
  });
  return merged;
}
function allChapters(){ return allCurriculum().flatMap(b=>b.chapters); }
function chapterByCode(code){ return allChapters().find(c=>c.code===code); }

// .filter+.flatMap, not .find -- more than one curriculum book can cover
// the same level (e.g. a cross-level "IQ & Logic Reasoning" book added via
// Admin -> Curriculum -> Add a whole new book, alongside the normal
// Beast Academy book for that level); .find would silently return only

function chaptersForLevel(level){ return allCurriculum().filter(b=>b.levels.includes(level)).flatMap(b=>b.chapters); }
function chaptersForBook(bookId){ return (allCurriculum().find(b=>b.bookId===bookId)?.chapters) || []; }

}
function chapterSelectOptions(bookId, selectedCode, allowAll){

}

function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
// Fixed Oct 2026: a multi-line commonEquation (a teacher pressing Enter
// between several equations, e.g. a system of equations) used to get
// wrapped as ONE $$...$$ block -- MathJax has no concept of a bare newline
// as a line break in math mode, so it just ran every line together with no
// separation, visually colliding into illegible, garbled-looking text.
// Splitting on newlines and giving each non-empty line its own $$...$$
// block (joined with <br>) renders each equation cleanly on its own line.
function commonEquationHtml(raw){
  const lines = String(raw||"").split("\n").map(l=>l.trim()).filter(Boolean);
  if(lines.length===0) return "";
  return `<div class="common-equation">${lines.map(l=>`$$${escapeHtml(l)}$$`).join("<br>")}</div>`;
}
// Converts our own safe formatting tokens into styling tags. Always called
// on text that has ALREADY been through escapeHtml() -- these tokens use
// characters escapeHtml doesn't touch, and this function never introduces
// raw HTML from user input, only these specific recognized patterns, so
// formatting can't become an XSS vector the way raw contenteditable HTML
// would be.
function renderRichText(escaped){
  return String(escaped ?? "")
    .replace(/\{\{color:(#[0-9a-fA-F]{3,6})\}\}([\s\S]*?)\{\{\/color\}\}/g, '<span style="color:$1">$2</span>')
    .replace(/\{\{size:(\d{1,3})\}\}([\s\S]*?)\{\{\/size\}\}/g, '<span style="font-size:$1px">$2</span>')
    .replace(/\*\*([\s\S]+?)\*\*/g, '<b>$1</b>')
    .replace(/__([\s\S]+?)__/g, '<u>$1</u>')
    .replace(/\*([\s\S]+?)\*/g, '<i>$1</i>');
}
// Block-level formatting (paragraphs + bullet lists) on top of
// renderRichText()'s inline tokens (bold/italic/underline/color) -- used
// for the SOP tab's admin-editable body text, which needs real paragraph
// breaks and bullets, unlike a question prompt's single inline block.
// Convention: a blank line starts a new paragraph; consecutive lines each
// starting with "- " become one <ul>. Safe the same way renderRichText
// is -- every line is escapeHtml()'d before any token substitution, so
// this never introduces raw HTML from admin input.
function renderSOPBody(text){
  const blocks = String(text||"").split(/\n\s*\n/);
  return blocks.map(block=>{
    const lines = block.split("\n").map(l=>l.trim()).filter(Boolean);
    if(lines.length===0) return "";
    if(lines.every(l=>l.startsWith("- "))){
      return `<ul>${lines.map(l=>`<li>${renderRichText(escapeHtml(l.slice(2)))}</li>`).join("")}</ul>`;
    }
    return `<p>${renderRichText(escapeHtml(block.trim())).replace(/\n/g,"<br>")}</p>`;
  }).join("");
}

function toastKind(msg){
  const m = msg.toLowerCase();
  if(m.includes("couldn't") || m.includes("failed") || m.includes("not found") || m.startsWith("only ")) return "error";
  if(m.startsWith("enter ") || m.startsWith("pick ") || m.startsWith("fill in") || m.startsWith("set a target") || m.includes("must be at least") || m.startsWith("maximum")) return "warn";
  return "success";
}
function toast(msg){
  const t = document.getElementById("toast");
  const kind = toastKind(msg);
  const icon = kind==="error" ? "✕" : kind==="warn" ? "⚠" : "✓";
  t.innerHTML = `<span aria-hidden="true">${icon}</span> ${escapeHtml(msg)}`;
  t.className = "toast show "+kind;
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove("show"), 2400);
}
function slugEmail(e){ return String(e||"").toLowerCase().replace(/[^a-z0-9@.]/g,"_"); }

// Append-only audit trail for the Admin tab's Activity Log. Fire-and-forget
// by design -- a logging failure must never block or fail the real action
// it's describing, so errors just go to console.

}

/* ---------------- options model (with legacy fallback) ---------------- */
function getQuestionOptions(q){
  if(Array.isArray(q.options) && q.options.length) return q.options;
  return (q.optionsEn||[]).map((t,i)=>({id:"legacy-"+i, text:t, image:null}));
}
function getCorrectOptionId(q){
  if(q.correctOptionId) return q.correctOptionId;
  return "legacy-"+(q.correctIndex??0);
}
function newOptionId(){ return "o"+Date.now()+"-"+Math.floor(Math.random()*10000); }

/* ---------------- Quilgo upload tracking (lives on the contest, not the question) ---------------- */
// A question can only be usefully "uploaded to Quilgo" in the context of a
// specific contest paper — this scans loaded contests for the first one
// whose uploadStatus map has an entry for this question.
function getQuilgoUploadInfo(questionId){
  for(const c of contests){
    const info = c.uploadStatus?.[questionId];
    if(info) return {...info, contestId:c.id, contestName:c.name};
  }
  return null;
}
function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* ---------------- image compression (Firestore-stored, no Storage bucket) ---------------- */
function compressImageFile(file, maxWidth, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth/img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width*scale);
        canvas.height = Math.round(img.height*scale);
        canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function fileToCompressedDataUrl(file){
  let dataUrl = await compressImageFile(file, 700, 0.6);
  if(dataUrl.length > 250000){
    dataUrl = await compressImageFile(file, 500, 0.4);
    if(dataUrl.length > 250000) toast("Image is still fairly large after compression — consider a smaller/simpler picture");
  }
  return dataUrl;
}

async function checkTeacherStatus(){
  if(!currentUser) return;
  try{
    const snap = await getDoc(doc(db, "teachers", currentUser.email));
    if(snap.exists()){
      isTeacherApproved = true;
      isAdminUser = snap.data().role === "admin";
      canFinalize = isAdminUser || snap.data().role === "qb_lead";
      isExternalReviewerUser = snap.data().role === "external_reviewer";
      isUploaderUser = snap.data().role === "uploader";
      document.querySelectorAll('[data-tab="admin"]').forEach(b=>b.hidden = !isAdminUser);
      // An external reviewer gets the normal Bank tab (full filters/search,
      // every question regardless of status) -- just not create/edit/
      // status controls -- so the rest of the app is hidden for them.
      ["activity","contests","quilgo","workload","curriculum","sop"].forEach(t=>{
        document.querySelectorAll(`[data-tab="${t}"]`).forEach(b=>b.hidden = isExternalReviewerUser);
      });
      // An uploader can only ever see the Upload tab -- everything else,
      // including Bank, is hidden; they land there directly since Bank
      // (the app's normal default tab) isn't available to them at all.
      ["bank","activity","contests","workload","curriculum","sop"].forEach(t=>{
        document.querySelectorAll(`[data-tab="${t}"]`).forEach(b=>b.hidden = isUploaderUser);
      });
      if(isUploaderUser) currentTab = "quilgo";
      document.getElementById("modal-root").innerHTML = "";
      renderSignedInChrome();
      startDataSubscriptions();
      renderTab();
    } else {
      isTeacherApproved = false;
      renderPending();
    }
  }catch(err){
    console.error(err);
    toast("Couldn't check access ("+err.code+")");
  }
}

function startDataSubscriptions(){
  const qy = query(collection(db,"questions"), orderBy("createdAt","desc"), limit(5000));
  unsubQuestions = onSnapshot(qy, snap=>{
    questions = snap.docs.map(d=>({id:d.id, ...d.data()}));
    dataReady.questions = true;
    // renderWorkload()'s progress cards also read `questions` (countByStatus)
    // to show live draft/in-review/locked counts per assigned chapter.
    if(currentTab==="bank" || currentTab==="activity" || currentTab==="contests" || currentTab==="quilgo" || currentTab==="workload") renderTab();
    if(openQuestionId) renderDrawer();
    updateActivityBadge();
    renderGamifyBar();
    renderInsightsRail();
  }, err=>{ console.error(err); toast("Couldn't load questions ("+err.code+")"); });
  const cy = query(collection(db,"contests"), orderBy("createdAt","desc"), limit(200));
  unsubContests = onSnapshot(cy, snap=>{
    contests = snap.docs.map(d=>({id:d.id, ...d.data()}));
    dataReady.contests = true;
    if(currentTab==="contests" || currentTab==="quilgo") renderTab();
  }, err=>{ console.error(err); toast("Couldn't load contests ("+err.code+")"); });
  const ay = query(collection(db,"assignments"), orderBy("createdAt","desc"), limit(200));
  unsubAssignments = onSnapshot(ay, snap=>{
    assignments = snap.docs.map(d=>({id:d.id, ...d.data()}));
    dataReady.assignments = true;
    // renderBank() also reads `assignments` (the "Assigned to you" banner),
    // so a newly created assignment needs to refresh the Bank tab too, not
    // just Workload -- otherwise it only appears after the teacher switches
    // tabs or reloads, since Bank is the default landing tab.
    if(currentTab==="workload" || currentTab==="bank") renderTab();
  }, err=>{ console.error(err); toast("Couldn't load assignments ("+err.code+")"); });
  unsubSettings = onSnapshot(doc(db,"settings","limits"), snap=>{
    if(snap.exists()) dailyLimits = {...dailyLimits, ...snap.data()};
    renderGamifyBar();
    renderInsightsRail();
    if(currentTab==="admin") renderTab();
  }, err=>console.error(err));
  unsubSop = onSnapshot(doc(db,"settings","sop"), snap=>{
    sopData = snap.exists() ? snap.data() : null;
    if(currentTab==="sop") renderTab();
  }, err=>console.error(err));
  unsubCurriculumExtra = onSnapshot(collection(db,"curriculumExtra"), snap=>{
    curriculumExtra = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(currentTab==="bank" || currentTab==="curriculum" || currentTab==="admin") renderTab();
  }, err=>{ console.error(err); });
  // Every signed-in teacher (not just admins) needs the full roster
  // client-side to balanced-randomly pick a peer reviewer (pickReviewer())
  // and for the gamify bar's team-average comparison -- renderTeachersTable()
  // already no-ops safely when the Admin tab's own table isn't in the DOM.
  subscribeTeachers();
}

/* ================= BANK TAB ================= */
function filteredQuestions(){
  const list = questions.filter(q=>{
    if(filters.level && !(Array.isArray(q.level) && q.level.includes(filters.level))) return false;
    if(filters.qtype && q.qType!==filters.qtype) return false;
    if(filters.diff && q.difficulty!==filters.diff) return false;
    if(filters.status && !matchesStatusFilter(q, filters.status)) return false;
    if(filters.unit && q.unit!==filters.unit) return false;
    if(filters.mine && q.authorEmail!==currentUser.email) return false;
    if(filters.author && q.authorEmail!==filters.author) return false;
    if(filters.skill && !(Array.isArray(q.skills) && q.skills.includes(filters.skill))) return false;
    // Dates compare on the local calendar day, not a raw ISO-string prefix
    // match, so "before/after" reads naturally regardless of time-of-day.
    if(filters.dateFrom){
      const d = new Date(q.createdAt);
      if(isNaN(d) || d < new Date(filters.dateFrom+"T00:00:00")) return false;
    }
    if(filters.dateTo){
      const d = new Date(q.createdAt);
      if(isNaN(d) || d > new Date(filters.dateTo+"T23:59:59")) return false;
    }
    if(filters.q){
      const hay = ((q.titleEn||"")+" "+(q.promptEn||"")+" "+(q.subtopic||"")).toLowerCase();
      if(!hay.includes(filters.q.toLowerCase())) return false;
    }
    return true;
  });
  return sortQuestions(list);
}
const DIFFICULTY_ORDER = ["medium","hard","very_hard"];
function sortQuestions(list){
  const sorted = list.slice();
  if(filters.sort==="oldest") sorted.sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||""));
  else if(filters.sort==="updated") sorted.sort((a,b)=>(b.updatedAt||b.createdAt||"").localeCompare(a.updatedAt||a.createdAt||""));
  else if(filters.sort==="difficulty") sorted.sort((a,b)=>DIFFICULTY_ORDER.indexOf(b.difficulty)-DIFFICULTY_ORDER.indexOf(a.difficulty));
  // "newest" needs no re-sort -- `questions` is already subscribed
  // ordered createdAt desc.
  return sorted;
}

const SORT_LABEL = {newest:"Newest first", oldest:"Oldest first", updated:"Recently updated", difficulty:"Hardest first"};
function activeFilterChips(){
  const chips = [];
  if(filters.level) chips.push({k:"level", l:`Level: ${filters.level}`});
  if(filters.qtype) chips.push({k:"qtype", l:`Type: ${QTYPES.find(t=>t.v===filters.qtype)?.l||filters.qtype}`});
  if(filters.diff) chips.push({k:"diff", l:`Difficulty: ${DIFFS.find(d=>d.v===filters.diff)?.l||filters.diff}`});
  if(filters.status) chips.push({k:"status", l:`Status: ${BANK_STATUS_FILTERS.find(s=>s.v===filters.status)?.l||filters.status}`});
  if(filters.book) chips.push({k:"book", l:`Book: ${allCurriculum().find(b=>b.bookId===filters.book)?.book||filters.book}`});
  if(filters.unit) chips.push({k:"unit", l:`Chapter: ${chapterLabel(filters.unit)}`});
  if(filters.mine) chips.push({k:"mine", l:"Only mine"});
  if(filters.skill) chips.push({k:"skill", l:`Skill: ${filters.skill}`});
  if(filters.author) chips.push({k:"author", l:`Author: ${allAuthors().find(([e])=>e===filters.author)?.[1]||filters.author}`});
  if(filters.dateFrom) chips.push({k:"dateFrom", l:`After ${fmtDateOnly(filters.dateFrom)}`});
  if(filters.dateTo) chips.push({k:"dateTo", l:`Before ${fmtDateOnly(filters.dateTo)}`});
  if(filters.q) chips.push({k:"q", l:`Search: "${filters.q}"`});
  return chips;
}

function updateActivityBadge(){
  let lastSeen = "";
  try{ lastSeen = localStorage.getItem("pmcqb-last-seen-activity") || ""; }catch(e){}
  const hasNew = questions.length>0 && (!lastSeen || questions[0].createdAt > lastSeen);
  ["nav-badge-activity","nav-badge-activity-m"].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.hidden = !hasNew;
  });
}

function myAssignedChapters(){
  const mine = [];
  assignments.forEach(a=>{
    const q = a.quotas?.[currentUser.email];
    if(!q) return;
    Object.entries(q).forEach(([unit,target])=>mine.push({unit, target, contestLevel:a.contestLevel, assignmentName:a.name}));
  });
  return mine;
}
// SOP §2.4's ~33/33/33 medium/hard/very-hard split, applied to one
// chapter's assigned target -- any remainder (target not divisible by 3)
// goes to medium then hard first, so the three always sum back to target.
function difficultyQuotas(target){
  const base = Math.floor(target/3);
  let rem = target - base*3;
  const q = {medium:base, hard:base, very_hard:base};
  ["medium","hard","very_hard"].forEach(d=>{ if(rem>0){ q[d]++; rem--; } });
  return q;
}
// `excludeId` lets an edit of an existing question check its own chapter's
// balance without counting itself twice.
function myDifficultyCountForChapter(email, level, unit, difficulty, excludeId){
  return questions.filter(q=>q.id!==excludeId && q.authorEmail===email && (q.level||[]).includes(level) && q.unit===unit && q.difficulty===difficulty).length;
}
// Same data as myAssignedChapters(), grouped and summed per contest level --
// feeds the insights-rail's compact "Your assignments" widget (one thin bar
// per level instead of one big card per chapter), with the per-chapter
// detail kept available for the expand-on-click drill-down.
function myAssignedByLevel(){
  const byLevel = {};
  myAssignedChapters().forEach(m=>{
    if(!byLevel[m.contestLevel]) byLevel[m.contestLevel] = { target:0, done:0, chapters:[] };
    const c = countByStatus(currentUser.email, m.contestLevel, m.unit);
    byLevel[m.contestLevel].target += m.target;
    byLevel[m.contestLevel].done += c.finalized;
    byLevel[m.contestLevel].chapters.push({ unit:m.unit, title:chapterByCode(m.unit)?.title||"", target:m.target, c });
  });
  return byLevel;
}
// The first assigned chapter this teacher hasn't finished yet, in
// assignment order -- powers "continue where you left off" on New Question.
function firstIncompleteAssignedUnit(){
  const pending = myAssignedChapters().find(m=>countByStatus(currentUser.email, m.contestLevel, m.unit).finalized < m.target);
  return pending?.unit || null;
}
async function loadCardEngagement(visible){
  const toFetch = visible.filter(q=>!cardEngagementCache[q.id]);
  await Promise.all(toFetch.map(async q=>{
    try{
      const [commentsSnap, ratingsSnap] = await Promise.all([
        getDocs(query(collection(db,"questions",q.id,"comments"), orderBy("createdAt","asc"))),
        getDocs(collection(db,"questions",q.id,"ratings")),
      ]);
      const comments = commentsSnap.docs.map(d=>({id:d.id, ...d.data()}));
      const ratings = ratingsSnap.docs.map(d=>d.data());
      const avgStars = ratings.length ? ratings.reduce((s,r)=>s+(r.stars||0),0)/ratings.length : null;
      cardEngagementCache[q.id] = {comments, avgStars, ratingCount:ratings.length};
    }catch(err){ console.error(err); cardEngagementCache[q.id] = {comments:[], avgStars:null, ratingCount:0}; }
    renderCardEngagement(q.id);
  }));
  // Cards already cached from an earlier render (e.g. flipping a filter
  // back and forth) still need their placeholder filled in immediately,
  // not just ones that triggered a fresh fetch this time.
  visible.filter(q=>cardEngagementCache[q.id]).forEach(q=>renderCardEngagement(q.id));
}
// Patches one card's engagement placeholder in place -- never re-renders
// the whole grid, so expanding one card's comments or a fetch landing
// doesn't disturb scroll position or any other card.
function renderCardEngagement(id){
  const el = document.getElementById("card-eng-"+id);
  const data = cardEngagementCache[id];
  if(!el || !data) return;
  const {comments, avgStars, ratingCount} = data;
  if(comments.length===0 && ratingCount===0){ el.innerHTML = ""; return; }
  const expanded = commentCardExpanded.has(id);
  const visibleComments = expanded ? comments : comments.slice(0,5);
  const overflow = comments.length - 5;
  el.innerHTML = `
    ${ratingCount>0 ? `<div class="hint" style="margin-top:4px;">★ ${avgStars.toFixed(1)} avg (${ratingCount} rating${ratingCount===1?"":"s"})</div>` : ""}
    ${comments.length>0 ? `
    <div class="card-comment-list">
      ${visibleComments.map(c=>`<div class="card-comment"><b>${escapeHtml(c.authorName||"—")}:</b> ${escapeHtml(c.text)}</div>`).join("")}
    </div>
    ${overflow>0 ? `<button type="button" class="link-btn" data-toggle-comments="${id}">${expanded?"Show fewer":`+${overflow} more comment${overflow===1?"":"s"}`}</button>` : ""}` : ""}
  `;
  el.querySelector("[data-toggle-comments]")?.addEventListener("click", e=>{
    e.stopPropagation();
    if(commentCardExpanded.has(id)) commentCardExpanded.delete(id); else commentCardExpanded.add(id);
    renderCardEngagement(id);
  });
}

function openForm(existing){

  const root = document.getElementById("modal-root");
  const levelSet = new Set(existing?.level||[]);
  let optionsState = getQuestionOptions(existing||{}).map(o=>({...o}));

  let correctOptionId = isEdit ? getCorrectOptionId(existing) : optionsState[0].id;
  let graphicImageState = existing?.graphicImage || null;
  let graphicImageWidthState = existing?.graphicImageWidth || 400;
  let graphicPositionState = existing?.graphicPosition || "center";
  let optionsLayoutState = existing?.optionsLayout || 2;
  let skillsState = existing?.skills ? [...existing.skills] : [];

  let previewEnAlign = existing?.textAlignEn || "left", previewUrAlign = existing?.textAlignUr || "right";
  let step = 1;

  // Firestore hard-caps a document at 1MiB; a question can carry a figure
  // plus up to 8 option images, so this budget check catches it before a
  // save fails with an opaque error rather than after. Declared up front
  // (not just before its first use further down) because renderOptionRows()
  // -- called during initial render, before this point in the old layout --
  // calls updateImageSizeIndicator(), which reads this constant: a `const`
  // referenced before its own declaration line throws, and only surfaced
  // when a question actually had at least one image already on it.
  const IMAGE_SIZE_WARN_BYTES = 700_000, IMAGE_SIZE_BLOCK_BYTES = 900_000;
  // "Continue where you left off": a brand-new question defaults its

  // same reasoning as IMAGE_SIZE_BLOCK_BYTES above: a const referenced
  // before its own declaration line throws.
  const EQUATION_SNIPPETS_PLAIN = [
    {label:"a/b", insert:"\\frac{a}{b}"}, {label:"√x", insert:"\\sqrt{x}"},
    {label:"xⁿ", insert:"x^{n}"}, {label:"x₁", insert:"x_{1}"},
    {label:"π", insert:"\\pi"}, {label:"×", insert:"\\times"}, {label:"÷", insert:"\\div"},
    {label:"≤", insert:"\\leq"}, {label:"≥", insert:"\\geq"},
  ];

  try{
  root.innerHTML = `

      <div class="editor-steps" id="editor-steps">
        <button type="button" data-step="1" class="active">1. Tags &amp; Difficulty</button>
        <button type="button" data-step="2">2. English &amp; Options</button>
        <button type="button" data-step="3">3. Urdu</button>
        <button type="button" data-step="4">4. Notes &amp; Review</button>
      </div>
      <div class="editor-body">
        ${locked ? `<div class="prompt-box" style="border:1px solid var(--red); color:var(--red); margin-bottom:12px;">This question is locked — only an Admin can edit it here. A QB Lead can unlock it by setting its status back to "In Review" from the question's detail view.</div>` : ""}
        <form id="q-form" ${locked?"inert":""}>
          <div class="step-panel" data-step="1">
            <div class="field"><label>Contest level(s)</label>
              <div style="display:flex; gap:12px; flex-wrap:wrap;">
                ${LEVELS.map(l=>`<label style="display:flex; align-items:center; gap:5px; font-weight:400; font-size:13px;"><input type="checkbox" name="level" value="${l}" ${levelSet.has(l)?"checked":""}/> ${l}</label>`).join("")}
              </div>
            </div>
            <div class="row2">
              <div class="field"><label>Question type</label><select name="qType">${QTYPES.map(t=>`<option value="${t.v}" ${existing?.qType===t.v?"selected":""}>${t.l}</option>`).join("")}</select></div>

  const formEl = document.getElementById("q-form");

  function renderOptionRows(){
    const wrap = document.getElementById("opts-wrap");
    wrap.innerHTML = optionsState.map((o,i)=>`
      <div class="opt-row">
        <input type="radio" name="correctOpt" value="${o.id}" ${o.id===correctOptionId?"checked":""} title="Mark correct" />
        <span class="k">${String.fromCharCode(65+i)}</span>
        <input type="text" data-opt-text="${o.id}" value="${escapeHtml(o.text)}" placeholder="Option ${String.fromCharCode(65+i)}" style="flex:1; min-width:120px;" />
        <label class="btn small" title="Add image" aria-label="Add an image to this option" style="cursor:pointer;">📷<input type="file" accept="image/*" data-opt-img="${o.id}" hidden /></label>
        ${o.image ? `<img src="${o.image}" class="opt-thumb" alt="Option ${String.fromCharCode(65+i)} image" /><button type="button" class="btn small" data-opt-rmimg="${o.id}" aria-label="Remove option ${String.fromCharCode(65+i)} image">✕ img</button>` : ""}
        <button type="button" class="btn small" style="color:var(--red);" data-opt-remove="${o.id}" ${optionsState.length<=2?"disabled":""}>Remove</button>
      </div>`).join("");
    wrap.querySelectorAll("[name=correctOpt]").forEach(el=>el.addEventListener("change", ()=>{ correctOptionId = el.value; }));
    wrap.querySelectorAll("[data-opt-text]").forEach(el=>el.addEventListener("input", ()=>{
      optionsState.find(o=>o.id===el.dataset.optText).text = el.value;
    }));
    wrap.querySelectorAll("[data-opt-img]").forEach(el=>el.addEventListener("change", async ()=>{
      const file = el.files[0]; if(!file) return;
      const opt = optionsState.find(o=>o.id===el.dataset.optImg);
      opt.image = await fileToCompressedDataUrl(file);
      renderOptionRows();
    }));
    wrap.querySelectorAll("[data-opt-rmimg]").forEach(el=>el.addEventListener("click", ()=>{
      optionsState.find(o=>o.id===el.dataset.optRmimg).image = null;
      renderOptionRows();
    }));
    wrap.querySelectorAll("[data-opt-remove]").forEach(el=>el.addEventListener("click", ()=>{
      if(optionsState.length<=2) return;
      const id = el.dataset.optRemove;
      optionsState = optionsState.filter(o=>o.id!==id);
      if(correctOptionId===id) correctOptionId = optionsState[0].id;
      renderOptionRows();
    }));
    updateImageSizeIndicator();
  }
  renderOptionRows();
  document.getElementById("opt-add").addEventListener("click", ()=>{
    if(optionsState.length>=8){ toast("Maximum 8 options"); return; }
    optionsState.push({id:newOptionId(), text:"", image:null});
    renderOptionRows();
  });
  document.getElementById("opt-shuffle").addEventListener("click", ()=>{
    optionsState = shuffleArray(optionsState);
    renderOptionRows();
  });
  document.querySelectorAll("[data-opt-layout]").forEach(b=>b.addEventListener("click", ()=>{
    optionsLayoutState = parseInt(b.dataset.optLayout,10);
    document.querySelectorAll("[data-opt-layout]").forEach(x=>x.classList.toggle("primary", parseInt(x.dataset.optLayout,10)===optionsLayoutState));
  }));

  function renderFigureWrap(){
    document.getElementById("figure-wrap").innerHTML = graphicImageState
      ? `<div style="text-align:${graphicPositionState};"><img src="${graphicImageState}" id="figure-img-preview" alt="Question figure" style="width:${graphicImageWidthState}px; max-width:100%; border-radius:6px; display:inline-block; margin-bottom:6px;" /></div><button type="button" class="btn small" id="figure-remove">Remove image</button>`
      : `<span class="hint">No figure yet — upload an image or draw one below.</span>`;
    document.getElementById("figure-remove")?.addEventListener("click", ()=>{ graphicImageState=null; renderFigureWrap(); renderResizeWrap(); });
    renderResizeWrap();
    updateImageSizeIndicator();
  }

  function totalImageBytes(){
    let total = (graphicImageState||"").length;
    optionsState.forEach(o=>{ total += (o.image||"").length; });
    return total;
  }
  function updateImageSizeIndicator(){
    const el = document.getElementById("image-size-indicator");
    if(!el) return;
    const bytes = totalImageBytes();
    if(bytes===0){ el.textContent = ""; return; }
    const kb = Math.round(bytes/1000);
    el.textContent = `Images: ~${kb}KB`;
    el.style.color = bytes>IMAGE_SIZE_BLOCK_BYTES ? "var(--red)" : bytes>IMAGE_SIZE_WARN_BYTES ? "var(--gold)" : "";
  }
  function renderResizeWrap(){
    const wrap = document.getElementById("figure-resize-wrap");
    if(!graphicImageState){ wrap.innerHTML = ""; return; }
    wrap.innerHTML = `
      <div class="field" style="margin-top:8px;">
        <label>Figure size</label>
        <div style="display:flex; align-items:center; gap:8px;">
          <button type="button" class="btn small" id="figure-shrink" aria-label="Shrink figure">−</button>
          <span class="mono" id="figure-width-label" style="min-width:60px; text-align:center;">${graphicImageWidthState}px</span>
          <button type="button" class="btn small" id="figure-grow" aria-label="Enlarge figure">+</button>
        </div>
      </div>
      <div class="field">
        <label>Figure position</label>
        <div style="display:flex; gap:6px;">
          ${["left","center","right"].map(p=>`<button type="button" class="btn small ${graphicPositionState===p?"primary":""}" data-figure-pos="${p}">${p[0].toUpperCase()+p.slice(1)}</button>`).join("")}
        </div>
      </div>`;
    const applyWidth = ()=>{
      document.getElementById("figure-width-label").textContent = graphicImageWidthState+"px";
      const img = document.getElementById("figure-img-preview");
      if(img) img.style.width = graphicImageWidthState+"px";
    };
    document.getElementById("figure-shrink").addEventListener("click", ()=>{ graphicImageWidthState = Math.max(150, graphicImageWidthState-25); applyWidth(); });
    document.getElementById("figure-grow").addEventListener("click", ()=>{ graphicImageWidthState = Math.min(900, graphicImageWidthState+25); applyWidth(); });
    wrap.querySelectorAll("[data-figure-pos]").forEach(b=>b.addEventListener("click", ()=>{
      graphicPositionState = b.dataset.figurePos;
      renderFigureWrap();
    }));
  }
  renderFigureWrap();
  document.getElementById("figure-file").addEventListener("change", async e=>{
    const file = e.target.files[0]; if(!file) return;
    graphicImageState = await fileToCompressedDataUrl(file);
    renderFigureWrap();
  });

  // Equation-insert helper: tracks whichever prompt/solution textarea was
  // last focused and inserts a LaTeX snippet at that cursor position.
  let lastFocusedTextarea = document.getElementById("promptEn-input");
  formEl.addEventListener("focusin", e=>{ if(e.target.tagName==="TEXTAREA") lastFocusedTextarea = e.target; });
  const EQUATION_SNIPPETS = [
    {label:"a/b", insert:"$\\frac{a}{b}$"}, {label:"√x", insert:"$\\sqrt{x}$"},
    {label:"xⁿ", insert:"$x^{n}$"}, {label:"x₁", insert:"$x_{1}$"},
    {label:"π", insert:"$\\pi$"}, {label:"×", insert:"$\\times$"}, {label:"÷", insert:"$\\div$"},
    {label:"≤", insert:"$\\leq$"}, {label:"≥", insert:"$\\geq$"}, {label:"°", insert:"°"},
  ];
  const eqPopover = document.getElementById("eq-popover");
  eqPopover.innerHTML = EQUATION_SNIPPETS.map(s=>`<button type="button" class="btn small mono" data-eq="${escapeHtml(s.insert)}">${s.label}</button>`).join("");
  eqPopover.querySelectorAll("[data-eq]").forEach(b=>b.addEventListener("click", ()=>{
    const ta = lastFocusedTextarea;
    const snippet = b.dataset.eq;
    ta.focus();
    ta.setRangeText(snippet, ta.selectionStart, ta.selectionEnd, "end");
    ta.dispatchEvent(new Event("input", {bubbles:true}));
  }));
  document.getElementById("eq-insert-btn").addEventListener("click", ()=>{ eqPopover.hidden = !eqPopover.hidden; });
  document.querySelectorAll("[data-eq-plain]").forEach(b=>b.addEventListener("click", ()=>{
    const ta = document.getElementById("commonEquation-input");
    ta.focus();
    ta.setRangeText(b.dataset.eqPlain, ta.selectionStart, ta.selectionEnd, "end");
  }));
  function wrapSelection(prefix, suffix){
    const ta = lastFocusedTextarea;
    const start = ta.selectionStart, end = ta.selectionEnd;
    const selected = ta.value.slice(start,end) || "text";
    ta.focus();
    ta.setRangeText(prefix+selected+suffix, start, end, "end");
    ta.dispatchEvent(new Event("input", {bubbles:true}));
  }
  document.getElementById("fmt-bold").addEventListener("click", ()=>wrapSelection("**","**"));
  document.getElementById("fmt-italic").addEventListener("click", ()=>wrapSelection("*","*"));
  document.getElementById("fmt-underline").addEventListener("click", ()=>wrapSelection("__","__"));
  document.getElementById("fmt-color").addEventListener("input", e=>wrapSelection(`{{color:${e.target.value}}}`,"{{/color}}"));
  document.getElementById("fmt-size").addEventListener("change", e=>{
    if(!e.target.value) return;
    wrapSelection(`{{size:${e.target.value}}}`,"{{/size}}");
    e.target.value = "";
  });
  document.getElementById("draw-figure-btn").addEventListener("click", ()=>{
    openFigureDrawTool(async dataUrl=>{
      graphicImageState = dataUrl;
      renderFigureWrap();
    });

  function updateDifficultyCallout(){
    const v = document.getElementById("f-difficulty").value;
    document.getElementById("difficulty-callout").innerHTML = `${escapeHtml(DIFFICULTY_SOP[v]||"")}<br><span class="hint">${escapeHtml(DIFFICULTY_DISTRIBUTION_NOTE)}</span>`;
  }
  // Live view of SOP §2.4's balance for whichever assigned chapter is
  // currently selected -- an assigned chapter's target splits ~evenly
  // across medium/hard/very_hard (difficultyQuotas()); this shows where the
  // teacher already stands against that split before they even try to save,
  // same information the step-submit guard below enforces at save time.
  function updateDifficultyBalanceHint(){
    const hintEl = document.getElementById("difficulty-balance-hint");
    if(!hintEl) return;
    const chapterCode = document.getElementById("f-chapter").value;
    const chosenLevels = Array.from(formEl.querySelectorAll('input[name="level"]:checked')).map(el=>el.value);
    const diff = document.getElementById("f-difficulty").value;
    const relevant = myAssignedChapters().filter(m=>m.unit===chapterCode && chosenLevels.includes(m.contestLevel));
    if(relevant.length===0){ hintEl.innerHTML = ""; return; }
    hintEl.innerHTML = relevant.map(m=>{
      const quotas = difficultyQuotas(m.target);
      const parts = ["medium","hard","very_hard"].map(d=>{
        const have = myDifficultyCountForChapter(currentUser.email, m.contestLevel, m.unit, d, existing?.id);
        const full = have>=quotas[d];
        const label = DIFFS.find(x=>x.v===d)?.l||d;
        return `<span style="${d===diff?"font-weight:700; text-decoration:underline;":""} ${full?"color:var(--red);":""}">${label} ${have}/${quotas[d]}${full?" (full)":""}</span>`;
      }).join(" &middot; ");
      return `<div class="hint" style="margin-top:4px;">${escapeHtml(m.contestLevel)} ${escapeHtml(m.unit)} balance (target ${m.target}) — ${parts}</div>`;
    }).join("");
  }
  updateDifficultyCallout();
  updateDifficultyBalanceHint();
  document.getElementById("f-difficulty").addEventListener("change", ()=>{ updateDifficultyCallout(); updateDifficultyBalanceHint(); });
  formEl.querySelectorAll('input[name="level"]').forEach(el=>el.addEventListener("change", updateDifficultyBalanceHint));

  // The skill list has grown past what a flat click-to-tag chip wall can show
  // cleanly -- Oct 2026, switched to a dropdown-to-add pattern: the chip wrap
  // now only shows what's already SELECTED (each removable via its own ×),
  // and the <select> only lists what's NOT selected yet, so neither list
  // grows unbounded with every skill in the system at once.
  function renderSkillsChips(){
    const wrap = document.getElementById("skills-chip-wrap");
    wrap.innerHTML = skillsState.length===0
      ? `<span class="hint">No skills tagged yet.</span>`
      : skillsState.map(s=>`<button type="button" class="pill skill-chip on" data-skill="${escapeHtml(s)}" title="Remove">${escapeHtml(s)} ×</button>`).join("");
    wrap.querySelectorAll("[data-skill]").forEach(b=>b.addEventListener("click", ()=>{
      skillsState = skillsState.filter(x=>x!==b.dataset.skill);
      renderSkillsChips();
    }));
    populateSkillSelect();
  }
  function populateSkillSelect(){
    const sel = document.getElementById("skill-select");
    const remaining = allSkills().filter(s=>!skillsState.includes(s));
    sel.innerHTML = `<option value="">+ Choose a skill…</option>` + remaining.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join("");
  }
  renderSkillsChips();
  document.getElementById("skill-select").addEventListener("change", e=>{
    const s = e.target.value;
    if(!s) return;
    if(!skillsState.includes(s)) skillsState = [...skillsState, s];
    renderSkillsChips();
  });
  const addSkill = ()=>{
    const input = document.getElementById("skill-new-input");
    const s = input.value.trim();
    if(!s) return;
    if(!skillsState.includes(s)) skillsState = [...skillsState, s];
    input.value = "";
    renderSkillsChips();
  };
  document.getElementById("skill-add-btn").addEventListener("click", addSkill);
  document.getElementById("skill-new-input").addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); addSkill(); } });

  const populateSubtopics = ()=>{
    const chapterCode = document.getElementById("f-chapter").value;
    const chapter = chapterByCode(chapterCode);
    const subs = chapter ? chapter.subtopics.slice() : [];
    const keepExisting = existing?.subtopic && existing.unit===chapterCode && !subs.includes(existing.subtopic);

    const pending = mine.find(m=>{

      const c = countByStatus(currentUser.email, m.contestLevel, m.unit);

    });
    warn.innerHTML = (!isAssignedToMe && pending)
      ? `<div class="callout warn">This topic isn't assigned to you — you still have pending work on <b>${escapeHtml(pending.unit)} — ${escapeHtml(chapterByCode(pending.unit)?.title||"")}</b> (${pending.target - countByStatus(currentUser.email, pending.contestLevel, pending.unit).finalized} more needed).</div>`

      logActivity("curriculum_added", `Added subtopic "${text}" to ${chapterCode}`, null);
      // Optimistic local update -- don't wait on the subscription

  function showStep(n){
    step = n;
    document.querySelectorAll(".step-panel").forEach(p=>{ p.hidden = (parseInt(p.dataset.step,10)!==n); });

    document.getElementById("step-back").hidden = n===1;

    document.getElementById("step-submit").hidden = n!==totalSteps;
    document.getElementById("editor-page").scrollTop = 0;

  }

  document.getElementById("preview-en-lh-shrink").addEventListener("click", ()=>{ previewEnLineHeight = Math.max(1.0, +(previewEnLineHeight-0.1).toFixed(1)); renderLivePreview(); });

  async function doSave(fd){
    const level = fd.getAll("level");
    const authorName = currentUser.displayName || currentUser.email;
    const promptEnTrimmed = fd.get("promptEn").trim();
    const autoTitle = promptEnTrimmed.length>60 ? promptEnTrimmed.slice(0,60).trim()+"…" : promptEnTrimmed;
    const body = {
      titleEn: autoTitle || "Untitled question", level, qType: fd.get("qType"), difficulty: fd.get("difficulty"),
      unit: fd.get("unit"), subtopic: fd.get("subtopic").trim(),
      promptEn: fd.get("promptEn").trim(), promptUr: fd.get("promptUr").trim(),
      options: optionsState.map(o=>({id:o.id, text:o.text.trim(), image:o.image||null})),
      correctOptionId, graphicImage: graphicImageState||null, graphicImageWidth: graphicImageState?graphicImageWidthState:null,
      graphicPosition: graphicImageState?graphicPositionState:null, optionsLayout: optionsLayoutState,
      graphicCaption: fd.get("graphicCaption").trim(), solutionEn: fd.get("solutionEn").trim(), skills: skillsState,
      commonEquation: fd.get("commonEquation").trim(),
      fontSizeEn: previewEnSize, fontSizeUr: previewUrSize,
      lineHeightEn: previewEnLineHeight, lineHeightUr: previewUrLineHeight,
      fontFamilyEn: previewEnFont, fontFamilyUr: previewUrFont,
      textAlignEn: previewEnAlign, textAlignUr: previewUrAlign,
      status: fd.get("status"), authorEmail: existing?.authorEmail || currentUser.email,
      authorName: existing?.authorName || authorName, updatedAt: new Date().toISOString(),
    };
    // The author revising a question a reviewer disagreed with re-queues it
    // for the *same* reviewer (continuity) rather than a fresh random pick.
    if(isEdit && existing.peerReview?.outcome==="disagree"){
      body.peerReview = freshPeerReview({email:existing.peerReview.reviewerEmail, name:existing.peerReview.reviewerName});
    }
    // Moving into "in_review" for the first time auto-assigns a reviewer --
    // same balanced-random pick the drawer's quick-status buttons use.
    if(body.status==="in_review" && !existing?.peerReview && !body.peerReview){
      const reviewer = pickReviewer(body.authorEmail);
      if(reviewer){
        body.peerReview = freshPeerReview(reviewer);
        logActivity("review_assigned", `Assigned "${body.titleEn}" to ${reviewer.name||reviewer.email} for review`, existing?.id||null);
      }
    }
    try{
      if(isEdit){
        const note = fd.get("editNote")?.trim() || "Edited";
        const hist = Array.isArray(existing.editHistory) ? existing.editHistory.slice(-19) : [];
        hist.push({ts:new Date().toISOString(), by:authorName, note});
        body.editHistory = hist;
        await updateDoc(doc(db,"questions",existing.id), body);
        logActivity(
          existing.status!==body.status ? "question_status_changed" : "question_updated",
          existing.status!==body.status
            ? `Set "${body.titleEn}" to ${STATUSES.find(s=>s.v===body.status)?.l||body.status}`
            : `Edited "${body.titleEn}"`,
          existing.id
        );
        toast("Question updated");
      } else {
        body.createdAt = body.updatedAt;
        body.editHistory = [{ts:body.createdAt, by:authorName, note:"Created"}];
        const ref = await addDoc(collection(db,"questions"), body);
        logActivity("question_created", `Posted "${body.titleEn}" (${body.unit})`, ref.id);
        toast("Question posted");
      }
      document.getElementById("confirm-root").innerHTML = "";
      closeModal();
      return true;
    }catch(err){ console.error(err); toast("Couldn't save ("+err.code+")"); return false; }
  }

  document.getElementById("step-submit").addEventListener("click", ()=>{
    const fd = new FormData(formEl);
    if(fd.getAll("level").length===0){ toast("Pick at least one contest level"); showStep(1); return; }
    if(!fd.get("promptEn").trim()){ toast("English prompt is required"); showStep(2); return; }
    if(optionsState.some(o=>!o.text.trim() && !o.image)){ toast("Every option needs text or an image"); showStep(2); return; }
    if(totalImageBytes() > IMAGE_SIZE_BLOCK_BYTES){ toast("Couldn't save — images are too large together; remove one or shrink a figure before saving"); showStep(2); return; }
    if(!fd.get("solutionEn").trim()){ toast("A solution is required before saving"); showStep(4); return; }
    if(!isEdit && countTodayCreated(currentUser.email) >= dailyLimits.dailyCreationLimit){
      toast(`Daily limit reached — ${dailyLimits.dailyCreationLimit} questions is the cap for today, come back tomorrow`);
      return;
    }
    // SOP §2.4 balance: an assigned chapter's target splits ~evenly across
    // medium/hard/very_hard (difficultyQuotas()) -- block saving past a
    // difficulty's share for a chapter actually assigned to this teacher,
    // so 15 assigned doesn't quietly become 15 "very hard" ones.
    {
      const chosenUnit = fd.get("unit"), chosenDiff = fd.get("difficulty"), chosenLevels = fd.getAll("level");
      const overQuota = myAssignedChapters().find(m=>{
        if(m.unit!==chosenUnit || !chosenLevels.includes(m.contestLevel)) return false;
        const quotas = difficultyQuotas(m.target);
        return myDifficultyCountForChapter(currentUser.email, m.contestLevel, m.unit, chosenDiff, existing?.id) >= quotas[chosenDiff];
      });
      if(overQuota){
        const quotas = difficultyQuotas(overQuota.target);
        const diffLabel = DIFFS.find(d=>d.v===chosenDiff)?.l || chosenDiff;
        toast(`${overQuota.contestLevel} ${overQuota.unit}'s ${diffLabel} share (${quotas[chosenDiff]} of its ${overQuota.target}-question target) is already full — pick a different difficulty to keep the ~33/33/33 split.`);
        showStep(2); return;
      }
    }
    // `existing?.status!=="finalized"` grandfathers in a question that's
    // *already* finalized (e.g. from before peer review existed) being
    // resaved without a status change -- this only blocks a NEW transition
    // into "finalized" that hasn't earned an agreeing review.
    if(fd.get("status")==="finalized" && existing?.status!=="finalized" && existing?.peerReview?.outcome!=="agree"){
      toast("Can't lock yet — peer review hasn't agreed with the marked answer"); showStep(4); return;
    }
    const correctOpt = optionsState.find(o=>o.id===correctOptionId);
    openConfirmPopup({
      promptEn: fd.get("promptEn").trim(), correctOpt,
      difficultyLabel: DIFFS.find(d=>d.v===fd.get("difficulty"))?.l || fd.get("difficulty"),
      levels: fd.getAll("level"),
      hasGraphic: !!(graphicImageState || fd.get("graphicCaption").trim()),
      onConfirm: ()=>doSave(fd),
    });
  });
  }catch(err){
    console.error("openForm failed to render", err);
    toast("Couldn't open the editor: "+(err.message||err));
    closeModal();
  }
}

// Lightweight built-in shape-drawing tool -- lines, rectangles, circles,
// arrows, and text labels, click-drag to place -- rasterized to a PNG data
// URL on save so it's stored/rendered exactly like an uploaded image
// (no TikZ/LaTeX figure compiler needed, which would require a multi-MB
// library or a backend).
function openFigureDrawTool(onSave){
  const root = document.getElementById("confirm-root");
  const W = 560, H = 360;
  let shapes = [];
  let tool = "line";
  let color = "#1a221e";
  let dragStart = null;
  root.innerHTML = `
    <div class="overlay" id="draw-ov" style="z-index:220;">
      <div class="gate-card" style="width:min(640px,95vw); text-align:left;">
        <h2 style="margin-top:0;">Draw a figure</h2>
        <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;">
          ${["line","rect","circle","arrow","text"].map(t=>`<button type="button" class="btn small ${tool===t?"primary":""}" data-tool="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join("")}
          <input type="color" id="draw-color" value="${color}" style="width:36px; padding:2px;" />
          <button type="button" class="btn small" id="draw-undo">Undo</button>
          <button type="button" class="btn small" id="draw-clear">Clear</button>
        </div>
        <svg id="draw-canvas" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="background:#fff; border:1px solid var(--border); border-radius:6px; cursor:crosshair; touch-action:none;"></svg>
        <p class="hint" style="margin:6px 0 0;">Click and drag to place a shape. Pick "Text" then click once to add a label.</p>
        <div style="display:flex; gap:8px; margin-top:14px;">
          <button class="btn ghost" id="draw-cancel" style="flex:1; justify-content:center;">Cancel</button>
          <button class="btn primary" id="draw-save" style="flex:1; justify-content:center;">Use this figure</button>
        </div>
      </div>
    </div>`;
  const svgNS = "http://www.w3.org/2000/svg";
  const canvas = document.getElementById("draw-canvas");
  function redraw(preview){
    canvas.innerHTML = `<defs><marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs>`;
    [...shapes, ...(preview?[preview]:[])].forEach(s=>{
      let el;
      if(s.type==="line" || s.type==="arrow"){
        el = document.createElementNS(svgNS,"line");
        el.setAttribute("x1",s.x1); el.setAttribute("y1",s.y1); el.setAttribute("x2",s.x2); el.setAttribute("y2",s.y2);
        el.setAttribute("stroke",s.color); el.setAttribute("stroke-width","2");
        if(s.type==="arrow") el.setAttribute("marker-end","url(#arrowhead)");
      } else if(s.type==="rect"){
        el = document.createElementNS(svgNS,"rect");
        el.setAttribute("x",Math.min(s.x1,s.x2)); el.setAttribute("y",Math.min(s.y1,s.y2));
        el.setAttribute("width",Math.abs(s.x2-s.x1)); el.setAttribute("height",Math.abs(s.y2-s.y1));
        el.setAttribute("fill","none"); el.setAttribute("stroke",s.color); el.setAttribute("stroke-width","2");
      } else if(s.type==="circle"){
        el = document.createElementNS(svgNS,"circle");
        const r = Math.hypot(s.x2-s.x1, s.y2-s.y1);
        el.setAttribute("cx",s.x1); el.setAttribute("cy",s.y1); el.setAttribute("r",r);
        el.setAttribute("fill","none"); el.setAttribute("stroke",s.color); el.setAttribute("stroke-width","2");
      } else if(s.type==="text"){
        el = document.createElementNS(svgNS,"text");
        el.setAttribute("x",s.x1); el.setAttribute("y",s.y1); el.setAttribute("fill",s.color); el.setAttribute("font-size","16");
        el.textContent = s.text||"";
      }
      if(el) canvas.appendChild(el);
    });
  }
  redraw();
  document.querySelectorAll("[data-tool]").forEach(b=>b.addEventListener("click", ()=>{
    tool = b.dataset.tool;
    document.querySelectorAll("[data-tool]").forEach(x=>x.classList.toggle("primary", x===b));
  }));
  document.getElementById("draw-color").addEventListener("input", e=>{ color = e.target.value; });
  document.getElementById("draw-undo").addEventListener("click", ()=>{ shapes.pop(); redraw(); });
  document.getElementById("draw-clear").addEventListener("click", ()=>{ shapes = []; redraw(); });
  function pt(e){
    const r = canvas.getBoundingClientRect();
    const clientX = e.touches?e.touches[0].clientX:e.clientX, clientY = e.touches?e.touches[0].clientY:e.clientY;
    return {x:(clientX-r.left)*(W/r.width), y:(clientY-r.top)*(H/r.height)};
  }
  canvas.addEventListener("pointerdown", e=>{
    const p = pt(e);
    if(tool==="text"){
      const text = prompt("Label text:");
      if(text) shapes.push({type:"text", x1:p.x, y1:p.y, color, text});
      redraw();
      return;
    }
    dragStart = p;
  });
  canvas.addEventListener("pointermove", e=>{
    if(!dragStart) return;
    const p = pt(e);
    redraw({type:tool, x1:dragStart.x, y1:dragStart.y, x2:p.x, y2:p.y, color});
  });
  window.addEventListener("pointerup", e=>{
    if(!dragStart) return;
    const p = pt(e);
    if(Math.hypot(p.x-dragStart.x, p.y-dragStart.y) > 3){
      shapes.push({type:tool, x1:dragStart.x, y1:dragStart.y, x2:p.x, y2:p.y, color});
    }
    dragStart = null;
    redraw();
  }, {once:false});
  document.getElementById("draw-cancel").addEventListener("click", ()=>{ root.innerHTML = ""; });
  document.getElementById("draw-save").addEventListener("click", async ()=>{
    try{
      const svgStr = new XMLSerializer().serializeToString(canvas);
      const svgBlob = new Blob([svgStr], {type:"image/svg+xml;charset=utf-8"});
      const url = URL.createObjectURL(svgBlob);
      const img = new Image();
      img.onload = async ()=>{
        const c = document.createElement("canvas");
        c.width = W; c.height = H;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0,0,W,H);
        ctx.drawImage(img,0,0,W,H);
        URL.revokeObjectURL(url);
        root.innerHTML = "";
        await onSave(c.toDataURL("image/png"));
      };
      img.onerror = ()=>{ toast("Couldn't render the figure"); };
      img.src = url;
    }catch(err){ console.error(err); toast("Couldn't render the figure"); }
  });
}

function openConfirmPopup({promptEn, correctOpt, difficultyLabel, levels, hasGraphic, onConfirm}){
  const root = document.getElementById("confirm-root");
  const items = [
    "This statement is ambiguity-free — only one defensible correct answer",
    "The correct option has been verified",
    "Difficulty and age-appropriateness are confirmed",
  ];
  if(hasGraphic) items.push("The graphic/figure is clear enough to be produced or is already attached correctly");
  root.innerHTML = `
    <div class="overlay" id="confirm-ov" style="z-index:210;">
      <div class="gate-card" style="width:min(480px,92vw); text-align:left;">
        <h2 style="margin-top:0;">Before you save…</h2>
        <div class="prompt-box">${renderRichText(escapeHtml(promptEn))}</div>
        <p style="font-size:13px;"><b>Marked correct:</b> ${correctOpt.image?`<img src="${correctOpt.image}" alt="Correct option image" style="height:20px; vertical-align:middle; margin-right:5px;"/>`:""}${escapeHtml(correctOpt.text)||"(image option)"}</p>

// html2canvas cannot be trusted to capture MathJax's rendered output
// directly -- confirmed by testing (the live page renders perfectly, only
// an html2canvas-captured canvas ghosts/doubles every equation, regardless
// of scale or html2canvas options). The fix: once MathJax has typeset,
// replace each rendered <mjx-container><svg>...</svg></mjx-container>
// with a plain <img> of that same SVG serialized to a data URL --
// html2canvas draws a plain image via drawImage(), sidestepping its
// fragile interpretation of MathJax's deeply-nested inline layout
// entirely, instead of trying (and failing) to re-lay it out itself.
function flattenMathToImages(root){
  const imgs = [];
  root.querySelectorAll("mjx-container svg").forEach(svg=>{
    const container = svg.closest("mjx-container");
    const rect = svg.getBoundingClientRect();
    if(rect.width<=0 || rect.height<=0) return;
    const svgClone = svg.cloneNode(true);
    svgClone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    const svgStr = new XMLSerializer().serializeToString(svgClone);
    const img = document.createElement("img");
    img.src = "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svgStr);
    img.style.width = rect.width+"px";
    img.style.height = rect.height+"px";
    img.style.verticalAlign = getComputedStyle(container).verticalAlign;
    container.replaceWith(img);
    imgs.push(img);
  });
  return Promise.all(imgs.map(img=>img.decode().catch(()=>{})));
}
async function downloadQuestionImage(q, config={includeQuestion:true, includeOptions:true, includeAnswer:false}){
  if(!window.html2canvas){ toast("Still loading — try again in a second"); return; }
  const node = document.createElement("div");
  node.style.cssText = "position:fixed; left:-9999px; top:0; width:800px; background:#fff; color:#161b19; padding:16px;";
  node.innerHTML = questionPreviewHtml(q, config);
  document.body.appendChild(node);
  if(window.MathJax?.typesetPromise) await window.MathJax.typesetPromise([node]).catch(()=>{});
  await flattenMathToImages(node);
  try{
    const canvas = await window.html2canvas(node, {scale:2, backgroundColor:"#ffffff"});
    // Suffix the filename with what's actually in it -- downloading the
    // question and options separately shouldn't have both save over the
    // same "question_name.png" and silently clobber each other.
    const part = config.includeQuestion && config.includeOptions ? "" :
      config.includeQuestion ? "_question" : config.includeOptions ? "_options" : "";
    const a = document.createElement("a");
    a.download = (q.titleEn||"question").replace(/[^a-z0-9]+/gi,"_").toLowerCase()+part+(config.includeAnswer?"_answer":"")+".png";
    a.href = canvas.toDataURL("image/png");
    a.click();
  }catch(err){ console.error(err); toast("Couldn't generate image"); }
  finally{ node.remove(); }
}

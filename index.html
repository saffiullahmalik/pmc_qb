  const queue = pendingReviewsFor(currentUser.email).sort((a,b)=>(a.peerReview.assignedAt||"").localeCompare(b.peerReview.assignedAt||""));

        <span class="pill diff-${q.difficulty}">${DIFFS.find(d=>d.v===q.difficulty)?.l||q.difficulty}${difficultyDots(q.difficulty)}</span>
        ${(q.skills||[]).map(s=>`<span class="pill skill-chip">${escapeHtml(s)}</span>`).join("")}
      </div>
      <div class="hint" style="margin-bottom:12px;">By <b>${escapeHtml(q.authorName||"—")}</b> · posted ${fmtDate(q.createdAt)}${q.updatedAt && q.updatedAt!==q.createdAt ? " · updated "+fmtDate(q.updatedAt) : ""} · ${escapeHtml(chapterLabel(q.unit))} / ${escapeHtml(q.subtopic||"—")}</div>
      <div id="review-step1">
        <p class="hint">Solve it yourself first — this only works if you don't peek at the marked answer beforehand.</p>

            <input type="radio" name="review-answer" value="${o.id}" style="margin-top:3px;" />
            <span>${String.fromCharCode(65+i)}. ${o.image?`<img src="${o.image}" alt="Option image" style="height:22px; vertical-align:middle; margin-right:4px; border-radius:3px;"/>`:""}${renderRichText(escapeHtml(o.text))}</span>
          </label>`).join("")}
        </div>
        <div class="field"><label>Your working / solution <span class="hint">(optional)</span></label><textarea id="review-note" rows="3" placeholder="Briefly show how you solved it, if you'd like"></textarea></div>
        <div class="field"><label>Time taken (minutes) <span class="hint">(optional)</span></label><input type="number" id="review-time" min="1" placeholder="e.g. 4" /></div>
        <button class="btn primary" id="review-continue" style="width:100%; justify-content:center; margin-top:10px;">Continue — see marked answer →</button>

          ${REVIEW_FLAGS.map(f=>`<label style="display:flex; align-items:flex-start; gap:8px; padding:7px 8px; font-weight:400; font-size:13px; border:1px solid var(--border); border-radius:8px; cursor:pointer;">

    step2.hidden = false;
    const correctOpt = opts.find(o=>o.id===correctId);

    const flag = REVIEW_FLAGS.find(f=>f.v===flagEl.value);
    const issueNote = document.getElementById("review-flag-note").value.trim();
    const outcome = flag.outcome;
    try{
      await updateDoc(doc(db,"questions",q.id), {
        peerReview: { ...q.peerReview, submittedAt:new Date().toISOString(), reviewerOptionId:chosenOptionId, reviewerNote:noteStep1, reviewTimeMinutes, outcome, issueFlag:flag.v, issueNote }
      });
      if(outcome==="disagree"){
        await addDoc(collection(db,"questions",q.id,"comments"), {
          authorName: currentUser.displayName||currentUser.email, authorEmail: currentUser.email,
          text: `Review — ${flag.short}: ${issueNote || "No additional detail provided."}`,
          createdAt: new Date().toISOString(),

      logActivity("review_submitted", `Reviewed "${q.titleEn||"Untitled"}" — ${flag.short}`, q.id);
      toast(outcome==="agree" ? "Review submitted — marked OK, ready to lock" : "Review submitted — sent back to the author");
      closeModal();
    }catch(err){ console.error(err); toast("Couldn't submit review"); }
  });
}

    ${isAdminUser && q.status==="finalized" && _comments.some(c=>allTeachers.find(t=>t.email===c.authorEmail)?.role==="external_reviewer")

    <div id="drawer-preview">${questionPreviewHtml(q)}</div>

        ${q.peerReview.outcome==="disagree" ? `<span class="pill" style="background:var(--red-soft); color:var(--red);">${escapeHtml(REVIEW_FLAGS.find(f=>f.v===q.peerReview.issueFlag)?.short || "Flagged")}</span> <b>${escapeHtml(q.peerReview.reviewerName)}</b> sent this back${q.peerReview.reviewTimeMinutes?` (${q.peerReview.reviewTimeMinutes} min)`:""} — see comments, fix, and resave to send it back for another look.` : ""}
        ${isAdminUser && q.peerReview.outcome==="pending" ? `<div style="margin-top:8px;"><button class="btn small" id="reassign-review">↻ Reassign to someone else</button></div>` : ""}
      </div>` : (q.status!=="finalized" ? `<div class="section-label">Peer review</div><div class="hint">Not yet reviewed — move to "In Review" to get a reviewer assigned.</div>` : "")}
    ${isExternalReviewerUser ? `

      ${STATUSES.map(s=>{
        const locked = (s.v==="finalized" && !canFinalize) || (s.v==="finalized" && q.status!=="finalized" && q.peerReview?.outcome!=="agree");
        const title = s.v==="finalized" && !canFinalize ? "Only QB Leads or Admins can lock a question"
          : s.v==="finalized" && q.status!=="finalized" && q.peerReview?.outcome!=="agree" ? "Can't lock yet — peer review hasn't agreed with the marked answer" : "";
        return `<button class="btn small ${q.status===s.v?"primary":""}" data-status="${s.v}" ${locked?`disabled title="${title}"`:""}>${s.l}</button>`;
      }).join("")}
      <button class="btn small ghost" id="download-img" style="margin-left:auto;">Download as image…</button>
      ${q.peerReview?.reviewerEmail===currentUser.email && q.peerReview.outcome==="pending" ? `<button class="btn small primary" id="review-q">🔍 Review this</button>` : ""}
      ${isLocked
        ? `<span class="btn small ghost" style="color:var(--red); cursor:default;" title="Locked — only an Admin can edit; a QB Lead can unlock it by setting status back to In Review">🔒 Locked</span>`

      ${isAdminUser ? `<button class="btn small" style="color:var(--red);" id="delete-q">Delete question</button>` : ""}
    </div>`}

      <span class="mono" style="font-size:12px; color:var(--ink-dim);">${avg? avg.toFixed(1)+" avg · "+_ratings.length+" rating"+(_ratings.length===1?"":"s") : "No ratings yet"} ${flags? " · "+flags+" flagged ambiguous":""}</span>
      <label style="display:flex; align-items:center; gap:5px; font-size:12px; margin-left:auto;"><input type="checkbox" id="flag-amb" ${myRating?.ambiguous?"checked":""}/> Flag ambiguous</label>

    <div class="section-label">Comments (${_comments.length})</div>
    <div id="comments-list">${_comments.length? _comments.map(c=>`
      <div class="comment-card">
        <div class="comment-head"><span class="comment-avatar">${escapeHtml((c.authorName||"?").trim().charAt(0).toUpperCase())}</span><b>${escapeHtml(c.authorName)}</b>${reviewerBadge(c.authorEmail)}<span class="hint mono">${fmtDate(c.createdAt)}</span></div>
        <div class="comment-txt">${escapeHtml(c.text)}</div>
      </div>`).join("") : `<div class="hint">No comments yet — be the first to give feedback.</div>`}</div>
    <div class="field" style="margin-top:10px;"><textarea id="new-comment" rows="2" placeholder="Add a comment for other teachers…"></textarea><button class="btn small primary" id="post-comment" style="align-self:flex-start;">Post comment</button></div>
    <div class="section-label">Edit history</div>
    <ul class="edit-log">${(q.editHistory||[]).slice().reverse().map(h=>`<li>${fmtDate(h.ts)} — <b>${escapeHtml(h.by)}</b>: ${escapeHtml(h.note)}</li>`).join("")}</ul>
  `;

  document.getElementById("edit-q")?.addEventListener("click", ()=>openForm(q));
  document.getElementById("review-q")?.addEventListener("click", ()=>openReviewForm(q));
  document.getElementById("reassign-review")?.addEventListener("click", async ()=>{
    const reviewer = pickReviewer(q.authorEmail, q.peerReview.reviewerEmail);
    if(!reviewer){ toast("No other teacher available to reassign to"); return; }
    if(!(await confirmDialog(`Reassign from ${q.peerReview.reviewerName} to ${reviewer.name||reviewer.email}? Their in-progress review (if any) will be discarded.`))) return;
    try{
      await updateDoc(doc(db,"questions",q.id), {peerReview: freshPeerReview(reviewer)});
      logActivity("review_assigned", `Reassigned "${q.titleEn||"Untitled"}" from ${q.peerReview.reviewerName} to ${reviewer.name||reviewer.email} for review`, q.id);
      toast("Reassigned");
    }catch(err){ console.error(err); toast("Couldn't reassign"); }
  });
  document.getElementById("download-img").addEventListener("click", ()=>openDownloadOptionsPopup(q));
  document.getElementById("delete-q")?.addEventListener("click", async ()=>{
    if(!(await confirmDialog(`Delete "${q.titleEn||"this question"}" permanently? This can't be undone.`, {danger:true}))) return;
    try{ await deleteDoc(doc(db,"questions",q.id)); logActivity("question_deleted", `Deleted "${q.titleEn||"Untitled"}"`, q.id); toast("Question deleted"); closeModal(); }
    catch(err){ console.error(err); toast("Couldn't delete question ("+err.code+")"); }
  });
  body.querySelectorAll("[data-remove-usedin]").forEach(el=>el.addEventListener("click", async ()=>{
    if(!(await confirmDialog(`Remove the "${el.dataset.removeUsedin}" tag from this question?`, {danger:true}))) return;
    try{
      await updateDoc(doc(db,"questions",q.id), {usedIn: arrayRemove(el.dataset.removeUsedin)});
      logActivity("tag_removed", `Removed usage tag "${el.dataset.removeUsedin}" from "${q.titleEn||"Untitled"}"`, q.id);
      toast("Tag removed");
    }catch(err){ console.error(err); toast("Couldn't remove tag"); }
  }));
  body.querySelectorAll("[data-remove-level]").forEach(el=>el.addEventListener("click", async ()=>{
    if((q.level||[]).length<=1){ toast("A question needs at least one contest level"); return; }
    if(!(await confirmDialog(`Remove the "${el.dataset.removeLevel}" level tag from this question?`, {danger:true}))) return;
    try{
      await updateDoc(doc(db,"questions",q.id), {level: arrayRemove(el.dataset.removeLevel)});
      logActivity("tag_removed", `Removed level tag "${el.dataset.removeLevel}" from "${q.titleEn||"Untitled"}"`, q.id);
      toast("Level tag removed");
    }catch(err){ console.error(err); toast("Couldn't remove tag"); }
  }));
  body.querySelectorAll("[data-status]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      if(btn.dataset.status==="finalized" && !canFinalize){ toast("Only QB Leads or Admins can lock a question"); return; }
      if(btn.dataset.status==="finalized" && q.status!=="finalized" && q.peerReview?.outcome!=="agree"){
        toast("Can't lock yet — peer review hasn't agreed with the marked answer"); return;
      }
      const update = {status:btn.dataset.status, updatedAt:new Date().toISOString()};
      if(btn.dataset.status==="in_review" && !q.peerReview){
        const reviewer = pickReviewer(q.authorEmail);
        if(reviewer) update.peerReview = freshPeerReview(reviewer);
      }
      try{
        await updateDoc(doc(db,"questions",q.id), update);
        logActivity("question_status_changed", `Set "${q.titleEn||"Untitled"}" to ${STATUSES.find(s=>s.v===btn.dataset.status)?.l||btn.dataset.status}`, q.id);
        if(update.peerReview) logActivity("review_assigned", `Assigned "${q.titleEn||"Untitled"}" to ${update.peerReview.reviewerName} for review`, q.id);
        toast("Status updated");
      }
      catch(err){ toast("Couldn't update status"); }
    });
  });
  document.getElementById("post-comment").addEventListener("click", async ()=>{
    const txt = document.getElementById("new-comment").value.trim();
    if(!txt) return;
    try{
      await addDoc(collection(db,"questions",q.id,"comments"), {authorName: currentUser.displayName||currentUser.email, authorEmail: currentUser.email, text:txt, createdAt:new Date().toISOString()});
      document.getElementById("new-comment").value = "";
    }catch(err){ toast("Couldn't post comment"); }
  });
  document.getElementById("like-btn").addEventListener("click", async ()=>{
    try{
      await updateDoc(doc(db,"questions",q.id), {
        likes: likedByMe ? arrayRemove(currentUser.email) : arrayUnion(currentUser.email),
        updatedAt: new Date().toISOString(),
      });
    }catch(err){ console.error(err); toast("Couldn't update like"); }
  });
  document.getElementById("star-btns").addEventListener("click", async e=>{
    const b = e.target.closest("[data-star]"); if(!b) return;
    const stars = parseInt(b.dataset.star,10);
    const ambiguous = document.getElementById("flag-amb").checked;
    try{
      await setDoc(doc(db,"questions",q.id,"ratings",slugEmail(currentUser.email)), {stars, ambiguous, authorName: currentUser.displayName||currentUser.email, authorEmail: currentUser.email, updatedAt:new Date().toISOString()});
      toast("Rating saved");
    }catch(err){ toast("Couldn't save rating"); }
  });
  document.getElementById("flag-amb").addEventListener("change", async e=>{
    try{
      await setDoc(doc(db,"questions",q.id,"ratings",slugEmail(currentUser.email)), {
        stars: myRating?.stars || 0, ambiguous: e.target.checked, authorName: currentUser.displayName||currentUser.email, authorEmail: currentUser.email, updatedAt:new Date().toISOString()
      });
    }catch(err){}
  });
}

/* ================= CONTESTS TAB ================= */
// How many of a contest's questions still haven't been marked uploaded to
// Quilgo -- shared by the Contests table's "Mark complete" gate and the
// Quilgo tab, so a paper can't be marked done while work remains on it.
function contestPendingCount(c){
  const qs = (c.questionIds||[]).map(id=>questions.find(q=>q.id===id)).filter(Boolean);
  const uploadStatus = c.uploadStatus || {};
  return qs.filter(q=>!uploadStatus[q.id]).length;
}
function renderContests(){
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="pagehead"><h1>Contests</h1><button class="btn primary" id="new-contest">+ Create New Contest</button></div>
    <p class="desc">Assemble a paper from locked questions, then print a bilingual paper and answer key. Saving a contest tags every question used in it, visible everywhere in the bank.</p>
    ${!dataReady.contests ? loadingState("Loading contests…") : contests.length===0 ? emptyState("No contests created yet.") : `
    <div class="table-wrap"><table class="data">
      <thead><tr><th>Category</th><th>Day</th><th>Slot</th><th>Name</th><th>Date</th><th>Questions</th><th>Duration</th><th>Total marks</th><th>Upload</th><th></th></tr></thead>
      <tbody>
        ${contests.map(c=>{
          const pending = contestPendingCount(c);
          return `
        <tr>
          <td class="mono">${escapeHtml(c.contestLevel||"—")}</td>
          <td class="mono">${c.day??"—"}</td>
          <td class="mono">${c.slot??"—"}</td>
          <td>${escapeHtml(c.name)}</td>
          <td class="mono">${fmtDate(c.createdAt)}</td>
          <td class="mono">${(c.questionIds||[]).length}</td>
          <td class="mono">${c.durationMinutes?c.durationMinutes+" min":"—"}</td>
          <td class="mono">${c.totalMarks??"—"}</td>
          <td>${c.quilgoComplete ? `<span class="pill status-uploaded">Complete</span>` : (isAdminUser?`<button class="btn small" data-mark-complete="${c.id}" ${pending>0?`disabled title="${pending} question${pending===1?"":"s"} still pending upload"`:""}>Mark complete</button>`:`<span class="hint">Pending</span>`)}</td>
          <td style="white-space:nowrap;">
            <button class="btn small" data-edit-contest="${c.id}">Edit</button>
            <button class="btn small" data-print="${c.id}">Print / Export PDF</button>
            ${isAdminUser?`<button class="btn small" style="color:var(--red);" data-delete-contest="${c.id}">Delete</button>`:""}
          </td>
        </tr>`;}).join("")}
      </tbody>
    </table></div>`}
  `;
  document.getElementById("new-contest").addEventListener("click", ()=>openContestForm());
  main.querySelectorAll("[data-edit-contest]").forEach(b=>b.addEventListener("click", ()=>{
    const c = contests.find(x=>x.id===b.dataset.editContest);
    if(c) openContestForm(c);
  }));
  main.querySelectorAll("[data-print]").forEach(b=>b.addEventListener("click", ()=>renderPrintView(b.dataset.print)));
  main.querySelectorAll("[data-mark-complete]").forEach(b=>b.addEventListener("click", async ()=>{
    try{
      await updateDoc(doc(db,"contests",b.dataset.markComplete), {quilgoComplete:true});
      logActivity("contest_quilgo_complete", `Marked upload complete for "${contests.find(x=>x.id===b.dataset.markComplete)?.name||"—"}"`, b.dataset.markComplete);
      toast("Marked complete");
    }
    catch(err){ toast("Couldn't update contest"); }
  }));
  main.querySelectorAll("[data-delete-contest]").forEach(b=>b.addEventListener("click", async ()=>{
    if(!(await confirmDialog("Delete this contest record? This also removes its usage tag from every question that was tagged with it.", {danger:true}))) return;
    const c = contests.find(x=>x.id===b.dataset.deleteContest);
    try{
      await deleteDoc(doc(db,"contests",b.dataset.deleteContest));
      if(c) await Promise.all((c.questionIds||[]).map(qid=>updateDoc(doc(db,"questions",qid), {usedIn: arrayRemove(c.name)}).catch(()=>{})));
      logActivity("contest_deleted", `Deleted contest "${c?.name||"—"}"`, b.dataset.deleteContest);
      toast("Contest deleted");
    }
    catch(err){ toast("Couldn't delete contest"); }
  }));
}

function openContestForm(existing){
  const isEdit = !!existing;
  const root = document.getElementById("modal-root");
  const eligible = questions.filter(q=>q.status==="finalized"||q.status==="uploaded");
  let selectedOrder = isEdit ? [...(existing.questionIds||[])] : [];
  root.innerHTML = `
    <div class="overlay" id="ov"><div class="drawer wide">
      <div class="drawer-head"><h2>${isEdit?"Edit contest":"Create new contest"}</h2><button class="btn ghost small" id="close-form">Close</button></div>
      <form id="contest-form">
        <div class="row2">
          <div class="field"><label>Category</label><select name="contestLevel" id="cf-level">${LEVELS.map(l=>`<option ${existing?.contestLevel===l?"selected":""}>${l}</option>`).join("")}</select></div>
          <div class="row2" style="grid-template-columns:1fr 1fr;">
            <div class="field"><label>Day</label><input type="number" name="day" min="1" value="${existing?.day??1}" required /></div>
            <div class="field"><label>Slot</label><input type="number" name="slot" min="1" value="${existing?.slot??1}" required /></div>
          </div>
        </div>
        <div class="field"><label>Contest name <span class="hint">(also stamped on each question as a usage tag)</span></label><input type="text" name="name" required placeholder="e.g. PMC Fall 2026 – Round 1 – Day 1 – Slot 1" value="${escapeHtml(existing?.name||"")}" /></div>
        <div class="field"><label>Paper header text</label><input type="text" name="headerText" placeholder="e.g. PMC 4 (Fall 2026) — Round 1" value="${escapeHtml(existing?.headerText||"")}" /></div>
        <div class="row2">
          <div class="field"><label>Duration (minutes)</label><input type="number" name="durationMinutes" min="1" placeholder="60" value="${existing?.durationMinutes??""}" /></div>
          <div class="field"><label>Total marks</label><input type="number" name="totalMarks" min="1" placeholder="30" value="${existing?.totalMarks??""}" /></div>
        </div>
        ${isEdit ? `
        <div class="callout">This paper has ${(existing.questionIds||[]).length} question(s) selected. Editing here only changes the paper's details, not which questions are in it — delete and recreate the contest if the question set itself needs to change.</div>
        ` : `
        <div class="row2" style="align-items:start;">
          <div>
            <div class="section-label" style="margin-top:0;">Select questions <span class="hint" id="picker-count"></span></div>
            <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px;">
              <input type="text" id="qp-search" placeholder="Search question text…" style="flex:2; min-width:180px;" />
              <select id="qp-unit" style="flex:1; min-width:150px;"><option value="">All chapters</option></select>
              <select id="qp-diff" style="flex:1; min-width:120px;"><option value="">All difficulties</option>${DIFFS.map(d=>`<option value="${d.v}">${d.l}</option>`).join("")}</select>
              <select id="qp-skill" style="flex:1; min-width:140px;"><option value="">All skills</option>${allSkills().map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join("")}</select>
              <select id="qp-author" style="flex:1; min-width:140px;"><option value="">All authors</option>${allAuthors().map(([email,name])=>`<option value="${escapeHtml(email)}">${escapeHtml(name)}</option>`).join("")}</select>
              <select id="qp-sort" style="flex:1; min-width:150px;">
                <option value="unit">Sort: Chapter</option>
                <option value="difficulty">Sort: Difficulty</option>
                <option value="newest">Sort: Newest first</option>
                <option value="author">Sort: Author</option>
              </select>
              <label style="display:flex; align-items:center; gap:5px; font-size:12px; white-space:nowrap;"><input type="checkbox" id="qp-hide-used" checked/> Hide already-used</label>
            </div>
            <div style="display:flex; gap:8px; margin-bottom:8px;">
              <button type="button" class="btn small" id="qp-select-all">Select all filtered</button>
              <button type="button" class="btn small ghost" id="qp-clear">Clear selection</button>
            </div>
            <div id="q-picker" style="max-height:420px; overflow-y:auto; border:1px solid var(--border); border-radius:9px; padding:8px;"></div>
          </div>
          <div>
            <div class="section-label" style="margin-top:0;">Selected order <span class="hint">(drag to reorder — this is the paper order)</span></div>
            <div id="order-list" style="min-height:80px; border:1px solid var(--border); border-radius:9px; padding:8px;">
              <div class="hint" style="padding:6px;">Check questions on the left to add them here.</div>
            </div>
          </div>
        </div>
        `}
        <button type="submit" class="btn primary" style="width:100%; justify-content:center; margin-top:12px;" ${(!isEdit && eligible.length===0)?"disabled":""}>${isEdit?"Save changes":"Create contest"}</button>
      </form>
    </div></div>`;
  document.getElementById("close-form").addEventListener("click", closeModal);
  document.getElementById("ov").addEventListener("click", e=>{ if(e.target.id==="ov") closeModal(); });

  if(!isEdit){
    // Filters live here (not in a module-level object) since they only
    // matter for the lifetime of this picker -- reset every time the modal
    // opens fresh, same scoping as selectedOrder above.
    const pickerFilters = {search:"", unit:"", diff:"", skill:"", author:"", sort:"unit", hideUsed:true};
    const SORTERS = {
      unit: (a,b)=> (a.unit||"").localeCompare(b.unit||"") || (DIFF_DOTS[a.difficulty]||0)-(DIFF_DOTS[b.difficulty]||0),
      difficulty: (a,b)=> (DIFF_DOTS[a.difficulty]||0)-(DIFF_DOTS[b.difficulty]||0),
      newest: (a,b)=> new Date(b.createdAt||0) - new Date(a.createdAt||0),
      author: (a,b)=> (a.authorName||a.authorEmail||"").localeCompare(b.authorName||b.authorEmail||""),
    };
    function levelEligible(){
      const level = document.getElementById("cf-level").value;
      return eligible.filter(q=>(q.level||[]).includes(level));
    }
    function filteredPickerList(){
      let list = levelEligible();
      if(pickerFilters.hideUsed) list = list.filter(q=>!(q.usedIn||[]).length);
      if(pickerFilters.unit) list = list.filter(q=>q.unit===pickerFilters.unit);
      if(pickerFilters.diff) list = list.filter(q=>q.difficulty===pickerFilters.diff);
      if(pickerFilters.skill) list = list.filter(q=>(q.skills||[]).includes(pickerFilters.skill));
      if(pickerFilters.author) list = list.filter(q=>q.authorEmail===pickerFilters.author);
      const needle = pickerFilters.search.trim().toLowerCase();
      if(needle) list = list.filter(q=>(q.titleEn||"").toLowerCase().includes(needle) || (q.promptEn||"").toLowerCase().includes(needle));
      return list.slice().sort(SORTERS[pickerFilters.sort] || SORTERS.unit);
    }
    // Chapters depend on the chosen category, so this list is rebuilt only
    // when the category changes -- rebuilding it on every keystroke/filter
    // change would blow away whatever chapter the admin had picked.
    function populateUnitFilterOptions(){
      const level = document.getElementById("cf-level").value;
      const sel = document.getElementById("qp-unit");
      sel.innerHTML = `<option value="">All chapters</option>` + chaptersForLevel(level).map(c=>`<option value="${escapeHtml(c.code)}">${escapeHtml(chapterLabel(c.code))}</option>`).join("");
      sel.value = "";
      pickerFilters.unit = "";
    }
    function renderPicker(){
      const level = document.getElementById("cf-level").value;
      const list = filteredPickerList();
      document.getElementById("picker-count").textContent = `(${list.length} of ${levelEligible().length} locked/uploaded for ${level})`;
      const picker = document.getElementById("q-picker");
      picker.innerHTML = list.length===0 ? `<div class="empty">No locked or uploaded questions match these filters.</div>` : list.map(q=>{
        const diffLbl = DIFFS.find(d=>d.v===q.difficulty)?.l || q.difficulty;

        <label style="display:flex; align-items:flex-start; gap:8px; padding:9px 6px; font-weight:400; font-size:13px; border-bottom:1px solid var(--border);">

            <div style="white-space:pre-wrap;">${escapeHtml(q.promptEn||"")}</div>
            <div class="hint" style="margin-top:4px;">by ${escapeHtml(q.authorName||q.authorEmail||"—")}${(q.skills||[]).length?" · "+q.skills.map(escapeHtml).join(", "):""}</div>

          </span>
        </label>`;
      }).join("");
      picker.querySelectorAll("[data-qid]").forEach(cb=>cb.addEventListener("change", ()=>{
        if(cb.checked) selectedOrder.push(cb.dataset.qid);

    }
    document.getElementById("cf-level").addEventListener("change", ()=>{ populateUnitFilterOptions(); renderPicker(); });
    document.getElementById("qp-search").addEventListener("input", e=>{ pickerFilters.search = e.target.value; renderPicker(); });
    document.getElementById("qp-unit").addEventListener("change", e=>{ pickerFilters.unit = e.target.value; renderPicker(); });
    document.getElementById("qp-diff").addEventListener("change", e=>{ pickerFilters.diff = e.target.value; renderPicker(); });
    document.getElementById("qp-skill").addEventListener("change", e=>{ pickerFilters.skill = e.target.value; renderPicker(); });
    document.getElementById("qp-author").addEventListener("change", e=>{ pickerFilters.author = e.target.value; renderPicker(); });
    document.getElementById("qp-sort").addEventListener("change", e=>{ pickerFilters.sort = e.target.value; renderPicker(); });
    document.getElementById("qp-hide-used").addEventListener("change", e=>{ pickerFilters.hideUsed = e.target.checked; renderPicker(); });
    document.getElementById("qp-select-all").addEventListener("click", ()=>{
      filteredPickerList().forEach(q=>{ if(!selectedOrder.includes(q.id)) selectedOrder.push(q.id); });
      renderPicker(); renderOrderList();
    });
    document.getElementById("qp-clear").addEventListener("click", ()=>{ selectedOrder = []; renderPicker(); renderOrderList(); });

    function renderOrderList(){
      const list = document.getElementById("order-list");
      if(selectedOrder.length===0){ list.innerHTML = `<div class="hint" style="padding:6px;">Check questions on the left to add them here.</div>`; return; }
      list.innerHTML = selectedOrder.map((id,i)=>{
        const q = eligible.find(x=>x.id===id);
        return `<div class="opt-row" draggable="true" data-id="${id}" aria-label="${escapeHtml(q?.titleEn||"Untitled")}, position ${i+1}, draggable to reorder" style="cursor:grab; background:var(--surface-2); border-radius:6px; padding:6px 8px; margin-bottom:5px;">
          <span class="mono" style="width:20px;">${i+1}.</span>
          <span style="flex:1;">${escapeHtml(q?.titleEn||"Untitled")}</span>
          <span class="hint" aria-hidden="true">⠿</span>
        </div>`;
      }).join("");
      let dragId = null;
      list.querySelectorAll("[data-id]").forEach(row=>{
        row.addEventListener("dragstart", ()=>{ dragId = row.dataset.id; });
        row.addEventListener("dragover", e=>e.preventDefault());
        row.addEventListener("drop", e=>{
          e.preventDefault();
          if(!dragId || dragId===row.dataset.id) return;
          const from = selectedOrder.indexOf(dragId), to = selectedOrder.indexOf(row.dataset.id);
          selectedOrder.splice(from,1);
          selectedOrder.splice(to,0,dragId);
          renderOrderList();
        });
      });
    }
    populateUnitFilterOptions();
    renderPicker();
    renderOrderList();
  }

  document.getElementById("contest-form").addEventListener("submit", async e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const name = fd.get("name").trim();
    if(!isEdit && selectedOrder.length===0){ toast("Pick at least one question"); return; }
    const body = {
      name, headerText: fd.get("headerText").trim(),
      contestLevel: fd.get("contestLevel"), day: parseInt(fd.get("day"),10)||1, slot: parseInt(fd.get("slot"),10)||1,
      durationMinutes: fd.get("durationMinutes") ? parseInt(fd.get("durationMinutes"),10) : null,
      totalMarks: fd.get("totalMarks") ? parseInt(fd.get("totalMarks"),10) : null,
    };
    try{
      if(isEdit){
        await updateDoc(doc(db,"contests",existing.id), body);
        // The name is also stamped on every question as a usedIn tag --
        // renaming here would otherwise leave those tags pointing at the
        // old name forever.
        if(name!==existing.name){
          await Promise.all((existing.questionIds||[]).map(qid=>
            updateDoc(doc(db,"questions",qid), {usedIn: arrayRemove(existing.name)}).catch(()=>{})
              .then(()=>updateDoc(doc(db,"questions",qid), {usedIn: arrayUnion(name)}).catch(()=>{}))
          ));
        }
        logActivity("contest_updated", `Updated contest "${name}"`, existing.id);
        toast("Contest updated");
      } else {
        const ref = await addDoc(collection(db,"contests"), {
          ...body, questionIds: selectedOrder, createdBy: currentUser.email, createdByName: currentUser.displayName||currentUser.email,
          createdAt: new Date().toISOString()
        });
        await Promise.all(selectedOrder.map(qid=>updateDoc(doc(db,"questions",qid), {usedIn: arrayUnion(name)})));
        logActivity("contest_created", `Created contest "${name}" (${body.contestLevel}, Day ${body.day} Slot ${body.slot})`, ref.id);
        toast("Contest created");
      }
      closeModal();
    }catch(err){ console.error(err); toast("Couldn't save contest ("+err.code+")"); }
  });
}

/* ================= WORKLOAD TAB ================= */
function unitsForLevel(level){
  return chaptersForLevel(level).map(c=>c.code);
}

// Four mutually-exclusive, sum-to-total buckets -- not just the 3 raw
// status values -- because "in_review" alone conflates two very different
// states: a question a reviewer is still actively working (or disagreed
// on), and one that's already been reviewed and agreed but is just sitting
// there waiting for a QB Lead to click Lock. `reviewed` splits that second
// state out so progress displays can show it distinctly instead of
// burying it inside "in review".
function countByStatus(email, level, unit){
  const mine = questions.filter(q=> q.authorEmail===email && (q.level||[]).includes(level) && q.unit===unit);
  const finalized = mine.filter(q=>q.status==="finalized"||q.status==="uploaded").length;
  const reviewed = mine.filter(q=>q.status==="in_review" && q.peerReview?.outcome==="agree").length;
  const inReview = mine.filter(q=>q.status==="in_review" && q.peerReview?.outcome!=="agree").length;
  const draft = mine.filter(q=>q.status==="draft").length;
  return {finalized, reviewed, inReview, draft, total:mine.length};
}

/* ---------------- daily limits, streaks, gamification ----------------
   All pure functions over the already-subscribed `questions` array --
   same "compute client-side over a small dataset" approach as every
   other progress/count helper in this app, no new collection needed. */
function isSameLocalDay(iso, date){
  if(!iso) return false;
  const d = new Date(iso);
  return d.getFullYear()===date.getFullYear() && d.getMonth()===date.getMonth() && d.getDate()===date.getDate();
}
function countCreatedOn(email, date){
  return questions.filter(q=>q.authorEmail===email && isSameLocalDay(q.createdAt, date)).length;
}
function countTodayCreated(email){ return countCreatedOn(email, new Date()); }
function countReviewsSubmittedOn(email, date){
  return questions.filter(q=>q.peerReview?.reviewerEmail===email && isSameLocalDay(q.peerReview?.submittedAt, date)).length;
}
function countTodaySubmittedReviews(email){ return countReviewsSubmittedOn(email, new Date()); }
function pendingReviewsFor(email){
  return questions.filter(q=>q.peerReview?.reviewerEmail===email && q.peerReview?.outcome==="pending");
}
function countThisWeek(email){
  const now = new Date();
  const start = new Date(now); start.setDate(now.getDate()-6); start.setHours(0,0,0,0);
  return questions.filter(q=>q.authorEmail===email && q.createdAt && new Date(q.createdAt)>=start).length;
}
// Consecutive days (ending today or yesterday -- a day not over yet
// shouldn't zero the streak) where this teacher met dailyCreationTarget.
function computeStreak(email){
  let streak = 0;
  const day = new Date();
  if(countCreatedOn(email, day) < dailyLimits.dailyCreationTarget) day.setDate(day.getDate()-1);
  while(countCreatedOn(email, day) >= dailyLimits.dailyCreationTarget){
    streak++;
    day.setDate(day.getDate()-1);
  }
  return streak;
}
// Allowlist (role is teacher/qb_lead unconditionally, or admin only if
// they've actually authored something) rather than a denylist of roles to
// skip -- external_reviewer/uploader/automation (and any future
// non-producing role) are excluded by default this way, without needing
// to be remembered here, same reasoning as pickReviewer()'s allowlist.
function isProducingTeacher_(t){
  return t.role==="teacher" || t.role==="qb_lead" || (t.role==="admin" && questions.some(q=>q.authorEmail===t.email));
}
function teamAverageToday(){
  const activeTeachers = allTeachers.filter(isProducingTeacher_);
  if(activeTeachers.length===0) return 0;
  const total = activeTeachers.reduce((s,t)=>s+countTodayCreated(t.email),0);
  return total/activeTeachers.length;
}
// Last 7 calendar days (oldest first, today last) -- feeds the Bank tab's
// insights-rail trend chart.
function last7DaysCounts(email){
  const days = [];
  for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(d); }
  return { labels: days.map(d=>d.toLocaleDateString(undefined,{weekday:"narrow"})), values: days.map(d=>countCreatedOn(email,d)) };
}
function myReviewStats(email){
  const mine = questions.filter(q=>q.peerReview?.reviewerEmail===email && q.peerReview.submittedAt);
  const agree = mine.filter(q=>q.peerReview.outcome==="agree").length;
  const disagree = mine.filter(q=>q.peerReview.outcome==="disagree").length;
  const times = mine.map(q=>q.peerReview.reviewTimeMinutes).filter(Boolean);
  const avgTime = times.length ? Math.round(times.reduce((a,b)=>a+b,0)/times.length) : null;
  return {agree, disagree, total:mine.length, avgTime};
}
// Each teacher's assigned target (summed across every assignment/level/
// chapter) alongside their actual draft/in-review/done counts across ALL
// their authored questions -- not just assigned chapters, so self-initiated
// work shows up too, not only quota fulfillment. Sorted by total output so
// the most active teachers surface first regardless of whether they have a
// formal quota at all.
// "IH" for "Imdad Hussain", "AJ" for "Ahmed Jamil" -- first letter of first
// and last name; a single-word name just takes its first two letters.
function initials(name){
  const parts = (name||"").trim().split(/\s+/).filter(Boolean);
  if(parts.length>=2) return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();
  return (parts[0]||"?").slice(0,2).toUpperCase();
}
// Review completion is part of "how much is this teacher actually doing"
// just as much as creation -- reviewsDone feeds both the admin chart's and
// the teacher-facing leaderboard's trailing value text.
function teacherComparisonData(){
  const targets = {};
  assignments.forEach(a=>{
    Object.entries(a.quotas||{}).forEach(([email,units])=>{
      targets[email] = (targets[email]||0) + Object.values(units).reduce((s,n)=>s+n,0);
    });
  });
  return allTeachers
    // Allowlist, not a denylist -- same reasoning as isProducingTeacher_()
    // above and pickReviewer()'s candidate filter: teacher/qb_lead always
    // show up, admin only if they've actually contributed (authored
    // something or carry a quota), and everything else (external_reviewer,
    // uploader, automation, any future role) is left out by default
    // instead of needing a new denylist entry remembered here.
    .filter(t=>t.role==="teacher" || t.role==="qb_lead" || (t.role==="admin" && (questions.some(q=>q.authorEmail===t.email) || targets[t.email])))
    .map(t=>{
      const mine = questions.filter(q=>q.authorEmail===t.email);
      const done = mine.filter(q=>q.status==="finalized"||q.status==="uploaded").length;
      const reviewed = mine.filter(q=>q.status==="in_review" && q.peerReview?.outcome==="agree").length;
      const inReview = mine.filter(q=>q.status==="in_review" && q.peerReview?.outcome!=="agree").length;
      const draft = mine.filter(q=>q.status==="draft").length;
      const reviewsDone = questions.filter(q=>q.peerReview?.reviewerEmail===t.email && q.peerReview.submittedAt).length;
      return { label: t.name||t.email, email: t.email, target: targets[t.email]||0, draft, inReview, reviewed, done, reviewsDone };
    })
    .sort((a,b)=> (b.draft+b.inReview+b.reviewed+b.done+b.reviewsDone) - (a.draft+a.inReview+a.reviewed+a.done+a.reviewsDone));
}

/* ---------------- peer review ---------------- */
// Balanced + random: among everyone except the author, find whoever has
// the fewest reviews currently sitting in their "pending" queue, then pick
// randomly among that tied-least-loaded set -- spreads load evenly without
// being predictable about who gets what.
// Allowlist (role==="teacher"||"qb_lead"), not a denylist -- external
// reviewers, uploaders, and admins are never eligible, and a new role
// added later is excluded by default instead of needing to be remembered
// here. Further restricted to teachers who actually have an assigned
// chapter quota somewhere -- by request, someone with no assignment at
// all isn't part of the content-creation pool review work distributes
// across. Shared by pickReviewer() (balanced-random auto-assign) and the
// Admin tab's "Pending reviews" reassign dropdown (every eligible name,
// admin picks).
function eligibleReviewerCandidates(authorEmail, excludeAlso){
  const assignedEmails = new Set();
  assignments.forEach(a=>Object.keys(a.quotas||{}).forEach(email=>assignedEmails.add(email)));
  return allTeachers.filter(t=>
    t.email!==authorEmail && t.email!==excludeAlso &&
    (t.role==="teacher" || t.role==="qb_lead") &&
    assignedEmails.has(t.email)
  );
}
function pickReviewer(authorEmail, excludeAlso){
  const candidates = eligibleReviewerCandidates(authorEmail, excludeAlso);
  if(candidates.length===0) return null;
  const load = {};
  candidates.forEach(t=>load[t.email]=0);
  questions.forEach(q=>{
    const r = q.peerReview;
    if(r && r.outcome==="pending" && load[r.reviewerEmail]!=null) load[r.reviewerEmail]++;
  });
  const minLoad = Math.min(...candidates.map(t=>load[t.email]));
  const leastLoaded = candidates.filter(t=>load[t.email]===minLoad);
  return leastLoaded[Math.floor(Math.random()*leastLoaded.length)];
}
function freshPeerReview(reviewer){
  return {
    reviewerEmail: reviewer.email, reviewerName: reviewer.name||reviewer.email,
    assignedAt: new Date().toISOString(), submittedAt: null,
    reviewerOptionId: null, reviewerNote: "", reviewTimeMinutes: null, outcome: "pending",
    issueFlag: null, issueNote: "",
  };
}

function progressCard(label, actual, target, sublabel){
  const pct = target>0 ? Math.min(100, Math.round((actual/target)*100)) : 0;
  const complete = target>0 && actual>=target;
  return `
    <div class="progress-card" style="${complete?"border-color:var(--accent);":""}">
      <div class="row"><b>${escapeHtml(label)}</b><span class="mono">${actual} / ${target}${complete?` <span class="pill status-uploaded" style="margin-left:5px;">Complete</span>`:""}</span></div>
      <div class="progress-bar"><div class="progress-bar-fill" data-target="${pct}" style="width:0%;"></div></div>
      ${sublabel ? `<div class="hint" style="margin-top:5px;">${sublabel}</div>` : ""}
    </div>`;
}
// progress-bar-fill renders at width:0 with its real value in data-target;
// call after inserting HTML so the width transition actually animates in
// (CSS can't transition from a value that never existed on first paint).
function animateProgressBars(){
  requestAnimationFrame(()=>{
    document.querySelectorAll(".progress-bar-fill[data-target]").forEach(el=>{
      el.style.width = el.dataset.target+"%";
    });
  });
}

function dueDateLabel(dueDate){
  if(!dueDate) return "";
  const overdue = new Date(dueDate+"T00:00:00") < new Date(new Date().toDateString());
  return `<span class="mono" style="${overdue?"color:var(--red); font-weight:600;":""}">${overdue?"Overdue — ":"Due "}${fmtDateOnly(dueDate)}</span>`;
}

/* ---------------- hand-rolled charts (no library -- see dataviz notes) ----
   Status colors are fixed and reused app-wide (draft=blue, in review=gold,
   locked/uploaded=accent, not-started=border-gray), never reassigned by
   filter, and every segment carries a direct value label rather than
   relying on color alone.
   Numeric label rule (fixed Oct 2026 after a real report: a level's bar
   read "8/180" while every teacher under it read "0/45", because the bar
   labeled draft+inReview+done combined, not done, against a target that
   specifically means "locked"): whenever a number is shown as X/target,
   X must be s.done (locked/uploaded) -- never draft+inReview+done combined
   -- so it always matches what every other "X/target" readout in the app
   means (the roster rows, progressCard, the rail's assignment bars, the
   gamify bar). Only when there's no target at all (self-initiated work,
   no quota) does a bare total-output number stand alone, since there's
   nothing it could misrepresent progress against. ---------------------- */
function barChartSvg(levels, byLevel){
  const W = 520, H = 190, padL = 6, padR = 6, padT = 22, padB = 24;
  const chartW = W - padL - padR, chartH = H - padT - padB;
  const maxVal = Math.max(1, ...levels.map(l=>Math.max(byLevel[l].target, byLevel[l].draft+byLevel[l].inReview+(byLevel[l].reviewed||0)+byLevel[l].done)));
  const groupW = chartW / levels.length;
  const barW = Math.min(64, groupW*0.5);
  let bars = "";
  levels.forEach((l,i)=>{
    const s = byLevel[l];
    const x = padL + i*groupW + (groupW-barW)/2;
    const total = s.draft + s.inReview + (s.reviewed||0) + s.done;
    const remaining = Math.max(0, s.target - total);
    const segs = [
      {v:s.done, cls:"bar-done"}, {v:s.reviewed||0, cls:"bar-reviewed"}, {v:s.inReview, cls:"bar-inreview"},
      {v:s.draft, cls:"bar-draft"}, {v:remaining, cls:"bar-remaining"},
    ];
    let y = padT + chartH;
    segs.forEach(seg=>{
      if(seg.v<=0) return;
      const h = (seg.v/maxVal)*chartH;
      y -= h;
      bars += `<rect x="${x}" y="${y.toFixed(1)}" width="${barW}" height="${h.toFixed(1)}" class="${seg.cls}" rx="3"/>`;
    });
    // Labeled with s.done (locked/uploaded), not `total` (draft+inReview+
    // done combined) -- `target` specifically means "locked" everywhere
    // else in the app (the roster rows right below this chart, every
    // progressCard, the rail's assignment bars), so showing anything else
    // against it here read as a contradiction: this bar could say "8/180"
    // while every teacher's own row said "0/45", because 8 counted
    // draft+in-review work that hadn't been locked yet. The segments above
    // still show that other work's color-coded breakdown; only the number
    // changes to match what "/target" means everywhere else.
    const isComplete = s.target>0 && s.done>=s.target;
    bars += `<text x="${x+barW/2}" y="${(y-8).toFixed(1)}" text-anchor="middle" class="mono chart-value-label" ${isComplete?'style="fill:var(--accent); font-weight:700;"':""}>${s.done}/${s.target}${isComplete?" ✓":""}</text>`;
    bars += `<text x="${x+barW/2}" y="${H-6}" text-anchor="middle" class="chart-axis-label">${escapeHtml(l)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" role="img" aria-label="Progress by contest level">${bars}</svg>`;
}
// `label` defaults to "done" (the Workload dashboard's original use); the
// center % always reflects segments[0] -- every caller puts its headline
// segment first, so this stays correct without re-finding by class name
// and lets a non-"done" first segment (e.g. review agreement rate) use its
// own label.
function donutChartSvg(segments, total, label="done"){
  const R = 52, STROKE = 20, cx = 74, cy = 74, C = 2*Math.PI*R;
  const denom = total>0 ? total : 1;
  let offset = 0, arcs = "";
  segments.forEach(seg=>{
    if(seg.value<=0) return;
    const frac = seg.value/denom;
    const slot = frac*C;
    const dash = Math.max(0, slot-3);
    arcs += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke-width="${STROKE}" class="${seg.cls}" stroke-dasharray="${dash.toFixed(1)} ${(C-dash).toFixed(1)}" stroke-dashoffset="${(-offset).toFixed(1)}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset += slot;
  });
  const headline = segments[0]?.value||0;
  const pct = total>0 ? Math.round(headline/total*100) : 0;
  return `<svg viewBox="0 0 148 148" class="chart-svg donut" role="img" aria-label="Overall status breakdown">
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke-width="${STROKE}" class="bar-remaining"/>
    ${arcs}
    <text x="${cx}" y="${cy-2}" text-anchor="middle" class="mono donut-center-value">${pct}%</text>
    <text x="${cx}" y="${cy+14}" text-anchor="middle" class="donut-center-label">${escapeHtml(label)}</text>
  </svg>`;
}
// Vertical GROUPED bar chart, one cluster of separate bars per teacher --
// Oct 2026, replaced the old hBarChartSvg (one horizontal STACKED bar per
// teacher, segments concatenated end-to-end) because comparing segment
// LENGTHS within a stacked bar across different teachers' bars is hard to
// eyeball; separate bars on a shared height scale let draft/in-review/
// reviewed/locked counts compare directly at a glance, teacher to teacher.
// Five bars per cluster: draft (red), in review (brown), reviewed (green),
// locked (blue), and reviews done (violet) -- that last one is a distinct
// metric (how much of THIS teacher's reviewING workload is done, not their
// own questions' status) kept as its own bar rather than folded into the
// other four, since authoring and reviewing are two different jobs.
// `rows` is an array (not a label-keyed map) so two teachers sharing a
// display name never collide. `W`/`rowH` control the viewBox -- same
// shrink-to-fit-container approach as barChartSvg (bar width shrinks as
// more teachers are added, rather than the chart overflowing).
function teacherGroupedBarSvg(rows, opts={}){
  const { W=540, rowH=190, labelFontSize=11 } = opts;
  const padL = 8, padR = 8, padT = 18, padB = 36;
  const chartW = W - padL - padR, chartH = rowH - padT - padB;
  const metrics = [
    {k:"draft", cls:"bar-draft"}, {k:"inReview", cls:"bar-inreview"},
    {k:"reviewed", cls:"bar-reviewed"}, {k:"done", cls:"bar-done"},
    {k:"reviewsDone", cls:"bar-reviewsdone"},
  ];
  const maxVal = Math.max(1, ...rows.flatMap(r=>metrics.map(m=>r[m.k]||0)));
  const groupW = chartW / Math.max(1,rows.length);
  const barW = Math.max(3, Math.min(14, (groupW-10)/metrics.length));
  const clusterW = barW*metrics.length;
  const valueFontSize = Math.max(7.5, labelFontSize-3);
  let out = "";
  rows.forEach((r,gi)=>{
    const gx = padL + gi*groupW + (groupW-clusterW)/2;
    metrics.forEach((m,mi)=>{
      const v = r[m.k]||0;
      if(v<=0) return;
      const h = Math.max(2, (v/maxVal)*chartH);
      const x = gx + mi*barW;
      const y = padT + chartH - h;
      out += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1,barW-1.5).toFixed(1)}" height="${h.toFixed(1)}" class="${m.cls}" rx="1.5"><title>${escapeHtml(r.fullName||r.label)} — ${m.k}: ${v}</title></rect>`;
    });
    out += `<text x="${(gx+clusterW/2).toFixed(1)}" y="${rowH-20}" text-anchor="middle" class="chart-axis-label" style="font-size:${labelFontSize}px; ${r.isMe?"font-weight:800; fill:var(--ink);":""}">${escapeHtml(r.label)}${r.fullName?`<title>${escapeHtml(r.fullName)}</title>`:""}</text>`;
    // Against a target, the number must mean "locked" (r.done) -- not the
    // sum of all four -- since that's what "/target" means everywhere else
    // in the app (progressCard, the rail's assignment bars, barChartSvg).
    const total = (r.draft||0)+(r.inReview||0)+(r.reviewed||0)+(r.done||0);
    out += `<text x="${(gx+clusterW/2).toFixed(1)}" y="${rowH-7}" text-anchor="middle" class="mono chart-value-label" style="font-size:${valueFontSize}px;">${r.target ? `${r.done}/${r.target}` : `${total}`}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${rowH}" class="chart-svg" role="img" aria-label="Per-teacher status breakdown">${out}</svg>`;
}
// Small single-series bar chart (daily trend, "you vs team" comparisons) --
// no target/breakdown concept, just one bar per label.
function simpleBarSvg(labels, values, cls="bar-done"){
  const W = 260, H = 108, padT = 14, padB = 18, gap = 6;
  const chartH = H - padT - padB;
  const maxVal = Math.max(1, ...values);
  const barW = (W - gap*(labels.length-1)) / labels.length;
  let bars = "";
  labels.forEach((lab,i)=>{
    const v = values[i];
    const h = maxVal>0 ? (v/maxVal)*chartH : 0;
    const x = i*(barW+gap);
    const y = padT + chartH - h;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(h,v>0?2:0).toFixed(1)}" class="${cls}" rx="2"/>`;
    bars += `<text x="${(x+barW/2).toFixed(1)}" y="${H-5}" text-anchor="middle" class="chart-axis-label" style="font-size:9.5px;">${escapeHtml(String(lab))}</text>`;
    if(v>0) bars += `<text x="${(x+barW/2).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" class="chart-value-label">${v}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" role="img" aria-label="Chart">${bars}</svg>`;
}

function renderWorkload(){

    html += loadingState("Loading assignments…");
  } else if(mine.length===0){
    html += emptyState("No topics assigned to you yet.");
  } else {
    mine.forEach(a=>{
      html += `<p class="desc" style="margin-bottom:6px;"><b>${escapeHtml(a.name)}</b> · ${escapeHtml(a.contestLevel)} ${a.dueDate?" · "+dueDateLabel(a.dueDate):""}</p>`;
      Object.entries(a.quotas[currentUser.email]).forEach(([unit,target])=>{
        const c = countByStatus(currentUser.email, a.contestLevel, unit);
        html += progressCard(`${unit} — ${chapterByCode(unit)?.title||""}`, c.finalized, target, `${c.draft} draft · ${c.inReview} in review · ${c.reviewed} reviewed (awaiting lock) · ${c.finalized} locked`);
      });
    });
  }
  if(isAdminUser){
    const byLevel = {};
    LEVELS.forEach(l=>{ byLevel[l] = { teacherSet:new Set(), chapterSet:new Set(), target:0, draft:0, inReview:0, reviewed:0, done:0 }; });
    assignments.forEach(a=>{
      const lvl = byLevel[a.contestLevel]; if(!lvl) return;
      Object.entries(a.quotas||{}).forEach(([email,units])=>{
        Object.entries(units).forEach(([unit,target])=>{
          lvl.teacherSet.add(email);
          lvl.chapterSet.add(unit);
          lvl.target += target;
          const c = countByStatus(email, a.contestLevel, unit);
          lvl.draft += c.draft; lvl.inReview += c.inReview; lvl.reviewed += c.reviewed; lvl.done += c.finalized;
        });

    });

      byLevel[l].teacherSet.forEach(t=>totalTeachers.add(t));
      totalChapters += byLevel[l].chapterSet.size;
      totalTarget += byLevel[l].target; totalDraft += byLevel[l].draft;
      totalInReview += byLevel[l].inReview; totalReviewed += byLevel[l].reviewed; totalDone += byLevel[l].done;
    });
    const overallPct = totalTarget>0 ? Math.round(totalDone/totalTarget*100) : 0;

    html += `<div class="section-label" style="margin-top:28px;">Workload dashboard</div>`;
    if(assignments.length===0){
      html += emptyState("No assignments created yet — click + New Assignment to build the board.");
    } else {
      html += `
        <div class="admin-grid">
          <div class="stat-tile"><div class="num">${totalTeachers.size}</div><div class="lbl">Teachers active</div></div>
          <div class="stat-tile"><div class="num">${totalChapters}</div><div class="lbl">Chapters assigned</div></div>
          <div class="stat-tile"><div class="num">${overallPct}%</div><div class="lbl">Overall complete</div></div>
        </div>
        <div class="dash-charts">
          <div class="dash-chart-card">
            <b>Progress by level</b>
            ${barChartSvg(LEVELS, byLevel)}
            <div class="chart-legend">
              <span><span class="swatch bar-done"></span>Locked</span>
              <span><span class="swatch bar-reviewed"></span>Reviewed (awaiting lock)</span>
              <span><span class="swatch bar-inreview"></span>In review</span>
              <span><span class="swatch bar-draft"></span>Draft</span>
              <span><span class="swatch bar-remaining"></span>Not started</span>
            </div>
          </div>
          <div class="dash-chart-card dash-chart-card-donut">
            <b>Overall status</b>
            ${donutChartSvg([
              {value:totalDone, cls:"bar-done"}, {value:totalReviewed, cls:"bar-reviewed"}, {value:totalInReview, cls:"bar-inreview"}, {value:totalDraft, cls:"bar-draft"},
            ], totalTarget, "locked")}
            <div class="chart-legend">
              <span><span class="swatch bar-done"></span>Locked ${totalDone}</span>
              <span><span class="swatch bar-reviewed"></span>Reviewed ${totalReviewed}</span>
              <span><span class="swatch bar-inreview"></span>In review ${totalInReview}</span>
              <span><span class="swatch bar-draft"></span>Draft ${totalDraft}</span>
            </div>
          </div>
        </div>
        <div class="section-label" style="margin-top:22px;">By contest level <span class="hint" style="text-transform:none; font-weight:400; letter-spacing:normal;">— click a level to see who's working on it</span></div>
        <div class="level-cards">
          ${LEVELS.map(l=>{
            const s = byLevel[l];
            const pct = s.target>0 ? Math.round(s.done/s.target*100) : 0;
            const isComplete = s.target>0 && s.done>=s.target;
            return `<button type="button" class="level-card ${workloadExpandedLevel===l?"active":""}" data-level-card="${l}" style="${isComplete?"border-color:var(--accent);":""}">
              <div class="level-card-head">${l}${isComplete?` <span class="pill status-uploaded" style="font-size:9.5px;">Complete</span>`:""}</div>
              <div class="progress-bar" style="margin:8px 0 6px;"><div class="progress-bar-fill" data-target="${pct}" style="width:0%;"></div></div>
              <div class="hint">${s.teacherSet.size} teacher${s.teacherSet.size===1?"":"s"} &middot; ${s.done}/${s.target} locked (${pct}%)</div>
              <div class="hint">${s.draft} draft &middot; ${s.inReview} in review &middot; ${s.reviewed||0} reviewed</div>
            </button>`;
          }).join("")}
        </div>
        <div id="level-roster"></div>
      `;
    }
    html += `<details class="records-details" style="margin-top:24px;">
      <summary class="section-label" style="cursor:pointer; display:inline-block;">All assignment records</summary>
      ${assignments.length===0 ? `<div class="empty">No assignments created yet.</div>` : `
        <div class="table-wrap"><table class="data"><thead><tr><th>Name</th><th>Level</th><th>Teachers</th><th>Due</th><th></th></tr></thead><tbody>
          ${assignments.map(a=>`<tr>
            <td>${escapeHtml(a.name)}</td>
            <td class="mono">${escapeHtml(a.contestLevel)}</td>
            <td class="mono">${(a.teacherEmails||[]).length}</td>
            <td>${a.dueDate?dueDateLabel(a.dueDate):"—"}</td>
            <td style="white-space:nowrap;">
              <button class="btn small" data-edit-assignment="${a.id}">Edit</button>
              <button class="btn small" style="color:var(--red);" data-delete-assignment="${a.id}">Delete</button>
            </td>
          </tr>`).join("")}
        </tbody></table></div>`}
    </details>`;
  }
  main.innerHTML = html;
  animateProgressBars();
  if(isAdminUser){
    subscribeTeachers();
    document.getElementById("new-assignment").addEventListener("click", ()=>openAssignmentForm());
    document.querySelectorAll("[data-edit-assignment]").forEach(b=>b.addEventListener("click", ()=>{
      const a = assignments.find(x=>x.id===b.dataset.editAssignment);
      if(a) openAssignmentForm(a);
    }));
    document.querySelectorAll("[data-delete-assignment]").forEach(b=>b.addEventListener("click", async ()=>{
      if(!(await confirmDialog("Delete this assignment? Teachers will no longer see this quota.", {danger:true}))) return;
      const a = assignments.find(x=>x.id===b.dataset.deleteAssignment);
      try{
        await deleteDoc(doc(db,"assignments",b.dataset.deleteAssignment));
        logActivity("assignment_deleted", `Deleted assignment "${a?.name||"—"}"`, b.dataset.deleteAssignment);
        toast("Assignment deleted");
      }
      catch(err){ toast("Couldn't delete assignment"); }
    }));
    document.querySelectorAll("[data-level-card]").forEach(b=>b.addEventListener("click", ()=>{
      workloadExpandedLevel = workloadExpandedLevel===b.dataset.levelCard ? null : b.dataset.levelCard;
      document.querySelectorAll("[data-level-card]").forEach(x=>x.classList.toggle("active", x.dataset.levelCard===workloadExpandedLevel));
      renderLevelRoster();
    }));
    renderLevelRoster();
  }
}

function renderLevelRoster(){
  const wrap = document.getElementById("level-roster");
  if(!wrap) return;
  if(!workloadExpandedLevel){ wrap.innerHTML = ""; return; }
  const level = workloadExpandedLevel;
  const merged = {};
  assignments.filter(a=>a.contestLevel===level).forEach(a=>{
    Object.entries(a.quotas||{}).forEach(([email,units])=>{
      merged[email] = merged[email] || {email, target:0, draft:0, inReview:0, reviewed:0, done:0};
      Object.entries(units).forEach(([unit,target])=>{
        merged[email].target += target;
        const c = countByStatus(email, level, unit);
        merged[email].draft += c.draft; merged[email].inReview += c.inReview;
        merged[email].reviewed += c.reviewed; merged[email].done += c.finalized;
      });
    });
  });
  const rows = Object.values(merged);
  wrap.innerHTML = rows.length===0 ? emptyState(`No teachers assigned to ${level} yet.`) : `
    <div class="section-label" style="margin-top:16px;">${level} — who's working on it</div>
    <div class="teacher-roster">
      ${rows.map(r=>{
        const t = allTeachers.find(x=>x.email===r.email);
        const pct = r.target>0 ? Math.round(r.done/r.target*100) : 0;
        const complete = r.target>0 && r.done>=r.target;
        return `<div>
          <button type="button" class="teacher-roster-row" data-teacher-detail="${r.email}" data-teacher-level="${level}">
            <span class="teacher-roster-name">${escapeHtml(t?.name||r.email)}</span>
            <div class="progress-bar" style="flex:1; margin:0 12px;"><div class="progress-bar-fill" data-target="${pct}" style="width:0%;"></div></div>
            <span class="hint mono">${r.done}/${r.target}${complete?" ✓":""}</span>
          </button>
          <div class="hint" style="margin:2px 0 8px 2px;">${r.draft} draft &middot; ${r.inReview} in review &middot; ${r.reviewed} reviewed${complete?` &middot; <b style="color:var(--accent);">Complete</b>`:""}</div>
        </div>`;
      }).join("")}
    </div>`;
  animateProgressBars();
  wrap.querySelectorAll("[data-teacher-detail]").forEach(b=>b.addEventListener("click", ()=>openTeacherWorkloadDetail(b.dataset.teacherDetail, b.dataset.teacherLevel)));
}

function openTeacherWorkloadDetail(email, level){
  const root = document.getElementById("modal-root");
  const t = allTeachers.find(x=>x.email===email);
  const rows = [];
  assignments.filter(a=>a.contestLevel===level && a.quotas?.[email]).forEach(a=>{
    Object.entries(a.quotas[email]).forEach(([unit,target])=>{
      rows.push({unit, target, c: countByStatus(email, level, unit)});
    });
  });
  root.innerHTML = `<div class="overlay" id="ov"><div class="drawer">
    <div class="drawer-head"><h2>${escapeHtml(t?.name||email)} — ${escapeHtml(level)}</h2><button class="btn ghost small" id="close-form">Close</button></div>
    <p class="hint" style="margin:0 0 14px;">${escapeHtml(email)}</p>
    ${rows.length===0 ? emptyState("No chapters assigned for this level.") : rows.map(r=>
      progressCard(`${r.unit} — ${chapterByCode(r.unit)?.title||""}`, r.c.finalized, r.target, `${r.c.draft} draft &middot; ${r.c.inReview} in review &middot; ${r.c.reviewed} reviewed (awaiting lock) &middot; ${r.c.finalized} locked`)
    ).join("")}

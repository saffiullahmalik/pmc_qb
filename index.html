function openAssignmentForm(existing){
  const root = document.getElementById("modal-root");
  if(allTeachers.length===0){
    root.innerHTML = `<div class="overlay" id="ov"><div class="drawer wide">
      <div class="drawer-head"><h2>New workload assignment</h2><button class="btn ghost small" id="close-form">Close</button></div>
      ${emptyState("No teacher accounts found yet — add teachers from Manage Teachers first.")}
    </div></div>`;
    document.getElementById("close-form").addEventListener("click", closeModal);
    document.getElementById("ov").addEventListener("click", e=>{ if(e.target.id==="ov") closeModal(); });
    return;
  }
  // A drag-and-drop board: one column per teacher plus an "Unassigned"
  // pool, per contest level. Every chapter card lives in exactly one
  // column at a time, so the same chapter can never end up with two
  // teachers -- duplicate assignment is structurally impossible, not just
  // validated against. Existing assignment docs (one per level) load into
  // this same board; every level touched during this session is written
  // in one Save, so a teacher's whole PMC-4 load and a different
  // teacher's PMC-5 load can be built and saved together.
  const existingByLevel = {};
  assignments.forEach(a=>{ if(!existingByLevel[a.contestLevel]) existingByLevel[a.contestLevel] = a; });
  if(existing) existingByLevel[existing.contestLevel] = existing;
  // allQuotas: { level: { teacherEmail: { chapterCode: targetCount } } }
  const allQuotas = {};
  LEVELS.forEach(l=>{ allQuotas[l] = existingByLevel[l]?.quotas ? JSON.parse(JSON.stringify(existingByLevel[l].quotas)) : {}; });
  let activeLevel = existing?.contestLevel || LEVELS[0];
  const sharedName = existing?.name || "";
  const sharedDue = existing?.dueDate || "";

  root.innerHTML = `
    <div class="overlay" id="ov"><div class="drawer wide">
      <div class="drawer-head"><h2>Workload assignment board</h2><button class="btn ghost small" id="close-form">Close</button></div>
      <p class="hint" style="margin:-4px 0 12px;">Drag a chapter card into a teacher's column to assign it, between columns to reassign it, or back to Unassigned to clear it. Switch levels freely — everything you set across all four is saved together.</p>
      <div class="row2">
        <div class="field"><label>Assignment name</label><input type="text" id="as-name" placeholder="e.g. PMC Fall 2026 Prep" value="${escapeHtml(sharedName)}" /></div>
        <div class="field"><label>Due date <span class="hint">(optional)</span></label><input type="date" id="as-due" value="${escapeHtml(sharedDue)}" /></div>
      </div>
      <div class="level-tabs" id="as-level-tabs">${LEVELS.map(l=>`<button type="button" class="${l===activeLevel?"active":""}" data-level="${l}">${l}</button>`).join("")}</div>
      <p class="hint" style="margin:8px 0 0;">${curriculumExtra.some(e=>e.type==="book") ? `Custom chapters (purple "Custom" tag below) come from Curriculum &rarr; manage or add more tracks like IQ &amp; Logic Reasoning there.` : `Want a cross-level track like <b>IQ &amp; Logic Reasoning</b> to assign here? <button type="button" class="link-btn" id="as-goto-curriculum" style="display:inline; font-weight:600;">Add it from Curriculum Map &rarr;</button>`}</p>
      <div class="kanban-board" id="as-board"></div>
      <button class="btn primary" id="as-save" style="width:100%; justify-content:center; margin-top:16px;">Save all assignments</button>
    </div></div>`;
  document.getElementById("close-form").addEventListener("click", closeModal);
  document.getElementById("ov").addEventListener("click", e=>{ if(e.target.id==="ov") closeModal(); });
  document.getElementById("as-goto-curriculum")?.addEventListener("click", ()=>{ closeModal(); switchTab("curriculum"); });

  function chapterCard(c, count){
    return `<div class="kanban-card" draggable="true" data-chapter="${c.code}">
      <span class="kanban-card-title">${c.custom?`<span class="pill" style="background:var(--violet-soft); color:var(--violet); font-size:9.5px; padding:1px 6px; margin-right:4px;">Custom</span>`:""}${c.code} — ${escapeHtml(c.title)}</span>
      ${count!=null ? `<div style="display:flex; align-items:center; gap:6px;">
        <input type="number" min="1" class="kanban-card-count" data-chapter-count="${c.code}" value="${count}" />
        <button type="button" class="btn small" data-remove-chapter="${c.code}" title="Unassign" aria-label="Unassign ${escapeHtml(c.title)}" style="margin-left:auto; padding:2px 7px;">✕</button>
      </div>` : ""}
    </div>`;
  }
  function renderBoard(){
    const chapters = chaptersForLevel(activeLevel);
    const mine = allQuotas[activeLevel];
    const assignedCodes = new Set(Object.values(mine).flatMap(m=>Object.keys(m)));
    const pool = chapters.filter(c=>!assignedCodes.has(c.code));
    const board = document.getElementById("as-board");
    board.innerHTML = `
      <div class="kanban-col" data-teacher="">
        <div class="kanban-col-head">Unassigned <span class="mono">(${pool.length})</span></div>
        <div class="kanban-cards" data-dropzone="">${pool.map(c=>chapterCard(c,null)).join("") || `<div class="kanban-empty">All chapters assigned</div>`}</div>
      </div>
      ${allTeachers.filter(t=>t.role!=="automation").map(t=>{
        const m = mine[t.email] || {};
        const cards = Object.keys(m).map(code=>{ const c = chapterByCode(code); return c ? chapterCard(c, m[code]) : ""; }).join("");
        return `<div class="kanban-col" data-teacher="${t.email}">
          <div class="kanban-col-head">${escapeHtml(t.name||t.email)} <span class="mono">(${Object.keys(m).length})</span></div>
          <select class="kanban-add-select" data-add-teacher="${t.email}" ${pool.length===0?"disabled":""}>
            <option value="">${pool.length===0?"No chapters left to add":"+ Add a chapter…"}</option>
            ${pool.map(c=>`<option value="${c.code}">${c.code} — ${escapeHtml(c.title)}</option>`).join("")}
          </select>
          <div class="kanban-cards" data-dropzone="${t.email}">${cards || `<div class="kanban-empty">Drop a chapter here, or use the dropdown above</div>`}</div>
        </div>`;
      }).join("")}
    `;
    // Assigning a chapter can also be done by picking it from each column's
    // dropdown -- native HTML5 drag-and-drop is unreliable across some
    // browsers/trackpads, so dragging alone shouldn't be the only way to
    // add more than one chapter to a teacher.
    board.querySelectorAll("[data-add-teacher]").forEach(sel=>sel.addEventListener("change", ()=>{
      const code = sel.value; if(!code) return;
      const teacherEmail = sel.dataset.addTeacher;
      mine[teacherEmail] = mine[teacherEmail] || {};
      mine[teacherEmail][code] = 5;
      renderBoard();
    }));
    let draggedCode = null;
    board.querySelectorAll("[data-chapter]").forEach(card=>{
      card.addEventListener("dragstart", e=>{
        draggedCode = card.dataset.chapter;
        card.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", draggedCode);
      });
      card.addEventListener("dragend", ()=>card.classList.remove("dragging"));
    });
    board.querySelectorAll("[data-dropzone]").forEach(zone=>{
      zone.addEventListener("dragover", e=>{ e.preventDefault(); zone.classList.add("drag-over"); });
      zone.addEventListener("dragleave", ()=>zone.classList.remove("drag-over"));
      zone.addEventListener("drop", e=>{
        e.preventDefault();
        zone.classList.remove("drag-over");
        if(!draggedCode) return;
        const targetTeacher = zone.dataset.dropzone;
        // Capture its existing count (if any) before removing -- otherwise
        // dropping a card back into its own column, or into a column it's
        // already in, would silently reset a custom count back to 5.
        let prevCount = null;
        Object.keys(mine).forEach(email=>{
          if(mine[email][draggedCode]!=null) prevCount = mine[email][draggedCode];
          delete mine[email][draggedCode];
        });
        if(targetTeacher){
          mine[targetTeacher] = mine[targetTeacher] || {};
          mine[targetTeacher][draggedCode] = prevCount || 5;
        }
        draggedCode = null;
        renderBoard();
      });
    });
    board.querySelectorAll("[data-chapter-count]").forEach(el=>el.addEventListener("input", e=>{
      const teacherEmail = el.closest("[data-teacher]").dataset.teacher;
      mine[teacherEmail][el.dataset.chapterCount] = parseInt(e.target.value,10)||0;
    }));
    board.querySelectorAll("[data-remove-chapter]").forEach(btn=>btn.addEventListener("click", ()=>{
      const teacherEmail = btn.closest("[data-teacher]").dataset.teacher;
      delete mine[teacherEmail][btn.dataset.removeChapter];
      renderBoard();
    }));
  }
  renderBoard();
  document.getElementById("as-level-tabs").addEventListener("click", e=>{
    const b = e.target.closest("[data-level]"); if(!b) return;
    activeLevel = b.dataset.level;
    document.querySelectorAll("#as-level-tabs button").forEach(x=>x.classList.toggle("active", x===b));
    renderBoard();
  });

  document.getElementById("as-save").addEventListener("click", async ()=>{
    const name = document.getElementById("as-name").value.trim();
    const dueDate = document.getElementById("as-due").value || null;
    const levelsWithWork = LEVELS.filter(l=>{
      return Object.values(allQuotas[l]).some(m=>Object.values(m).some(n=>n>0));
    });
    if(levelsWithWork.length===0){ toast("Assign at least one chapter to a teacher"); return; }
    try{
      for(const level of levelsWithWork){
        const cleanQuotas = {};
        Object.entries(allQuotas[level]).forEach(([email,m])=>{
          const filtered = Object.fromEntries(Object.entries(m).filter(([,n])=>n>0));
          if(Object.keys(filtered).length) cleanQuotas[email] = filtered;
        });
        const teacherEmails = Object.keys(cleanQuotas);
        const unitTotals = {};
        Object.values(cleanQuotas).forEach(m=>Object.entries(m).forEach(([c,n])=>{ unitTotals[c]=(unitTotals[c]||0)+n; }));
        const units = Object.entries(unitTotals).map(([unit,target])=>({unit,target}));
        const body = { name: name || `${level} assignment`, contestLevel: level, units, teacherEmails, quotas: cleanQuotas, dueDate };
        const existingDoc = existingByLevel[level];
        if(existingDoc){
          await updateDoc(doc(db,"assignments",existingDoc.id), body);
          logActivity("assignment_updated", `Updated ${level} assignment "${body.name}" (${teacherEmails.length} teacher${teacherEmails.length===1?"":"s"})`, existingDoc.id);
        } else {
          const ref = await addDoc(collection(db,"assignments"), {
            ...body, createdBy: currentUser.email, createdByName: currentUser.displayName||currentUser.email,
            createdAt: new Date().toISOString()
          });
          logActivity("assignment_created", `Created ${level} assignment "${body.name}" (${teacherEmails.length} teacher${teacherEmails.length===1?"":"s"})`, ref.id);
        }
      }
      toast("Assignments saved");
      closeModal();
    }catch(err){ console.error(err); toast("Couldn't save assignments ("+err.code+")"); }
  });
}

/* ================= QUILGO TAB ================= */
function renderQuilgo(){
  const main = document.getElementById("main");
  // Contests need contestLevel/day/slot (added when this cascading picker
  // shipped) to be findable this way -- older contests without them fall
  // into the "Unspecified" bucket, which points back at Edit instead of
  // silently disappearing from the tab.
  const withMeta = contests.filter(c=>c.contestLevel && c.day!=null && c.slot!=null);
  const unspecified = contests.filter(c=>!(c.contestLevel && c.day!=null && c.slot!=null));
  const days = quilgoLevel ? Array.from(new Set(withMeta.filter(c=>c.contestLevel===quilgoLevel).map(c=>c.day))).sort((a,b)=>a-b) : [];
  const slots = (quilgoLevel && quilgoDay!=="") ? Array.from(new Set(withMeta.filter(c=>c.contestLevel===quilgoLevel && String(c.day)===String(quilgoDay)).map(c=>c.slot))).sort((a,b)=>a-b) : [];
  const matches = (quilgoLevel && quilgoDay!=="" && quilgoSlot!=="") ? withMeta.filter(c=>c.contestLevel===quilgoLevel && String(c.day)===String(quilgoDay) && String(c.slot)===String(quilgoSlot)) : [];
  if(matches.length===1) quilgoContestId = matches[0].id;
  else if(matches.length!==1 && quilgoLevel!=="__unspecified__" && !matches.some(c=>c.id===quilgoContestId)) quilgoContestId = "";

  main.innerHTML = `
    <div class="pagehead"><h1>Upload</h1></div>
    <p class="desc">Pick the category, day, and slot to land on one paper, download each question, and mark it uploaded once it's live.</p>
    <div class="filters">
      <select id="quilgo-level">
        <option value="">Category…</option>
        ${LEVELS.map(l=>`<option value="${l}" ${quilgoLevel===l?"selected":""}>${l}</option>`).join("")}
        ${unspecified.length ? `<option value="__unspecified__" ${quilgoLevel==="__unspecified__"?"selected":""}>Unspecified (${unspecified.length}) — needs category/day/slot</option>` : ""}
      </select>
      ${quilgoLevel && quilgoLevel!=="__unspecified__" ? `<select id="quilgo-day"><option value="">Day…</option>${days.map(d=>`<option value="${d}" ${String(quilgoDay)===String(d)?"selected":""}>Day ${d}</option>`).join("")}</select>` : ""}
      ${quilgoLevel && quilgoLevel!=="__unspecified__" && quilgoDay!=="" ? `<select id="quilgo-slot"><option value="">Slot…</option>${slots.map(s=>`<option value="${s}" ${String(quilgoSlot)===String(s)?"selected":""}>Slot ${s}</option>`).join("")}</select>` : ""}
      ${quilgoLevel==="__unspecified__" ? `<select id="quilgo-contest-unspecified"><option value="">Select a contest…</option>${unspecified.map(c=>`<option value="${c.id}" ${quilgoContestId===c.id?"selected":""}>${escapeHtml(c.name)}</option>`).join("")}</select>` : ""}
    </div>
    ${matches.length>1 ? `<div class="callout warn">More than one contest matches ${quilgoLevel} Day ${quilgoDay} Slot ${quilgoSlot} — pick one: ${matches.map(c=>`<button type="button" class="btn small" data-pick-match="${c.id}">${escapeHtml(c.name)}</button>`).join(" ")}</div>` : ""}
    <div id="quilgo-body"></div>
  `;
  document.getElementById("quilgo-level").addEventListener("change", e=>{ quilgoLevel = e.target.value; quilgoDay=""; quilgoSlot=""; quilgoContestId=""; renderQuilgo(); });
  document.getElementById("quilgo-day")?.addEventListener("change", e=>{ quilgoDay = e.target.value; quilgoSlot=""; quilgoContestId=""; renderQuilgo(); });
  document.getElementById("quilgo-slot")?.addEventListener("change", e=>{ quilgoSlot = e.target.value; renderQuilgo(); });
  document.getElementById("quilgo-contest-unspecified")?.addEventListener("change", e=>{ quilgoContestId = e.target.value; renderQuilgoBody(); });
  document.querySelectorAll("[data-pick-match]").forEach(b=>b.addEventListener("click", ()=>{ quilgoContestId = b.dataset.pickMatch; renderQuilgoBody(); }));
  renderQuilgoBody();
}

function renderQuilgoBody(){
  const body = document.getElementById("quilgo-body");
  if(!body) return;
  const c = contests.find(x=>x.id===quilgoContestId);
  if(!c){ body.innerHTML = emptyState("Pick a category, day, and slot above to see that paper's questions."); return; }
  const qs = (c.questionIds||[]).map(id=>questions.find(q=>q.id===id)).filter(Boolean);
  const uploadStatus = c.uploadStatus || {};
  const row = (q)=>{
    const info = uploadStatus[q.id];
    return `
    <div class="progress-card" style="display:flex; align-items:center; gap:12px;">
      <span class="mono" style="width:26px; flex:0 0 auto;">${qs.indexOf(q)+1}.</span>
      <div style="flex:1; min-width:0;">
        <div style="font-weight:600; font-size:13.5px;">${escapeHtml(q.titleEn||"Untitled")}</div>
        <div class="hint">${escapeHtml((q.promptEn||"").slice(0,90))}${(q.promptEn||"").length>90?"…":""}</div>
        ${info ? `<div class="hint">Uploaded by <b>${escapeHtml(info.uploadedByName||"—")}</b> · ${fmtDate(info.uploadedAt)}</div>` : ""}
      </div>
      <button class="btn small" data-dl="${q.id}">Download image…</button>
      ${info ? `<button class="btn small" data-undo="${q.id}">Undo</button>` : `<button class="btn small primary" data-mark="${q.id}">Mark uploaded</button>`}
    </div>`;
  };
  const pending = qs.filter(q=>!uploadStatus[q.id]);
  const done = qs.filter(q=>uploadStatus[q.id]);
  const paperLabel = c.contestLevel ? `${c.contestLevel} — Day ${c.day}, Slot ${c.slot} — ${escapeHtml(c.name)}` : escapeHtml(c.name);
  body.innerHTML = `
    <div class="section-label" style="margin-top:0;">${paperLabel}</div>
    ${c.quilgoComplete
      ? `<div class="progress-card" style="border-color:var(--accent);"><span class="pill status-uploaded">Complete</span> <span class="hint">This contest's upload work is marked done.</span></div>`
      : isAdminUser ? `<button class="btn small" id="quilgo-mark-complete" style="margin-bottom:14px;" ${pending.length>0?`disabled title="${pending.length} question${pending.length===1?"":"s"} still pending upload"`:""}>Mark this contest's upload complete</button>` : ""}
    ${pending.length>0 ? `<div class="callout">Up next: <b>${qs.indexOf(pending[0])+1}. ${escapeHtml(pending[0].titleEn||"Untitled")}</b></div>` : ""}
    <div class="section-label">Pending upload (${pending.length})</div>
    ${pending.length===0 ? `<div class="empty">${qs.length===0?"This contest has no questions.":"All questions in this contest are uploaded."}</div>` : pending.map(row).join("")}
    <div class="section-label" style="margin-top:22px;">Already uploaded (${done.length})</div>
    ${done.length===0 ? `<div class="hint">None yet.</div>` : done.map(row).join("")}
  `;
  document.getElementById("quilgo-mark-complete")?.addEventListener("click", async ()=>{
    try{
      await updateDoc(doc(db,"contests",c.id), {quilgoComplete:true});
      logActivity("contest_quilgo_complete", `Marked upload complete for "${c.name}"`, c.id);
      toast("Marked complete");
    }
    catch(err){ toast("Couldn't update contest"); }
  });
  body.querySelectorAll("[data-dl]").forEach(b=>b.addEventListener("click", ()=>{
    const q = questions.find(x=>x.id===b.dataset.dl); if(q) openDownloadOptionsPopup(q, {showAnswerOption:false});
  }));
  body.querySelectorAll("[data-mark]").forEach(b=>b.addEventListener("click", async ()=>{
    try{
      await updateDoc(doc(db,"contests",c.id), {
        [`uploadStatus.${b.dataset.mark}`]: { uploadedBy: currentUser.email, uploadedByName: currentUser.displayName||currentUser.email, uploadedAt: new Date().toISOString() }
      });
      toast("Marked as uploaded");
    }catch(err){ console.error(err); toast("Couldn't update ("+err.code+")"); }
  }));
  body.querySelectorAll("[data-undo]").forEach(b=>b.addEventListener("click", async ()=>{
    try{
      await updateDoc(doc(db,"contests",c.id), { [`uploadStatus.${b.dataset.undo}`]: deleteField() });
      toast("Marked as not uploaded");
    }catch(err){ console.error(err); toast("Couldn't update ("+err.code+")"); }
  }));
}

/* ================= SOP TAB ================= */
// sopData is null until an admin has ever saved an edit -- falls back to
// the hardcoded SOP_TEXT (converted to the same {heading, body} shape,
// body joined with blank lines so renderSOPBody() treats each original
// paragraph correctly) at sensible default formatting.
function effectiveSopSections(){
  if(sopData?.sections) return sopData.sections;
  return SOP_TEXT.map(s=>({heading:s.heading, body:s.body.join("\n\n")}));
}
function effectiveSopStyle(){
  return {fontSize: sopData?.fontSize || 13.5, lineHeight: sopData?.lineHeight || 1.65};
}
let sopDraftSections = [];
let sopDraftStyle = {fontSize:13.5, lineHeight:1.65};
function renderSOP(){
  const main = document.getElementById("main");
  if(sopEditing && isAdminUser){
    main.innerHTML = sopEditFormHtml();
    wireSOPEditForm();
    return;
  }
  const sections = effectiveSopSections();
  const style = effectiveSopStyle();
  main.innerHTML = `
    <div class="pagehead"><h1>PMC Examination SOP</h1>${isAdminUser?`<button class="btn" id="sop-edit-btn">✎ Edit</button>`:""}</div>
    <p class="desc">Preparation, Review, Administration, and Publication of PMC Examination Papers — Sundar STEM School.</p>
    ${sections.map(s=>`
      <div class="level-block">
        <h3>${escapeHtml(s.heading)}</h3>
        <div class="sop-body" style="font-size:${style.fontSize}px; line-height:${style.lineHeight};">${renderSOPBody(s.body)}</div>
      </div>`).join("")}
    <p class="note">Source: PMC_Examination_SOP_v2.pdf.${sopData?.updatedAt ? ` Last edited ${fmtDate(sopData.updatedAt)}${sopData.updatedByName?" by "+escapeHtml(sopData.updatedByName):""}.` : ""}</p>
  `;
  document.getElementById("sop-edit-btn")?.addEventListener("click", ()=>{
    sopDraftSections = effectiveSopSections().map(s=>({...s}));
    sopDraftStyle = {...effectiveSopStyle()};
    sopEditing = true;
    renderTab();
  });
}
// Reads whatever's currently in the heading/body/format inputs back into
// the draft arrays before a re-render (add/remove section) or save, so an
// in-progress edit to one section isn't lost by an action on another.
function syncSopDraftFromDom(){
  document.querySelectorAll("[data-sop-heading]").forEach((el,i)=>{ if(sopDraftSections[i]) sopDraftSections[i].heading = el.value; });
  document.querySelectorAll("[data-sop-body]").forEach((el,i)=>{ if(sopDraftSections[i]) sopDraftSections[i].body = el.value; });
  const fs = document.getElementById("sop-fontsize"); if(fs && fs.value) sopDraftStyle.fontSize = parseFloat(fs.value)||13.5;
  const lh = document.getElementById("sop-lineheight"); if(lh && lh.value) sopDraftStyle.lineHeight = parseFloat(lh.value)||1.65;
}
function sopEditFormHtml(){
  return `
    <div class="pagehead"><h1>Edit SOP</h1></div>
    <div class="filters" style="align-items:flex-end;">
      <div class="field" style="margin:0;"><label>Font size (px)</label><input type="number" id="sop-fontsize" min="10" max="24" step="0.5" value="${sopDraftStyle.fontSize}" style="width:90px;" /></div>
      <div class="field" style="margin:0;"><label>Line height</label><input type="number" id="sop-lineheight" min="1.0" max="2.5" step="0.05" value="${sopDraftStyle.lineHeight}" style="width:90px;" /></div>
    </div>
    <p class="hint" style="margin:8px 0 16px;">A blank line starts a new paragraph. A line starting with "- " becomes a bullet point. **bold**, *italic*, and __underline__ still work inside the text.</p>
    ${sopDraftSections.map((s,i)=>`
      <div class="level-block">
        <div class="field"><label>Heading</label><input type="text" data-sop-heading value="${escapeHtml(s.heading)}" /></div>
        <div class="field"><label>Body</label><textarea data-sop-body rows="6">${escapeHtml(s.body)}</textarea></div>
        <button type="button" class="btn small" style="color:var(--red);" data-remove-section="${i}">Remove this section</button>
      </div>`).join("")}
    <button type="button" class="btn" id="sop-add-section">+ Add section</button>
    <div style="display:flex; gap:8px; margin-top:16px;">
      <button type="button" class="btn ghost" id="sop-cancel">Cancel</button>
      <button type="button" class="btn primary" id="sop-save">Save</button>
    </div>
  `;
}
function wireSOPEditForm(){
  document.getElementById("sop-add-section").addEventListener("click", ()=>{
    syncSopDraftFromDom();
    sopDraftSections.push({heading:"New section", body:""});
    renderTab();
  });
  document.querySelectorAll("[data-remove-section]").forEach(b=>b.addEventListener("click", ()=>{
    syncSopDraftFromDom();
    sopDraftSections.splice(parseInt(b.dataset.removeSection,10),1);
    renderTab();
  }));
  document.getElementById("sop-cancel").addEventListener("click", ()=>{ sopEditing = false; renderTab(); });
  document.getElementById("sop-save").addEventListener("click", async ()=>{
    syncSopDraftFromDom();
    if(sopDraftSections.length===0){ toast("Add at least one section"); return; }
    if(sopDraftSections.some(s=>!s.heading.trim())){ toast("Every section needs a heading"); return; }
    try{
      await setDoc(doc(db,"settings","sop"), {
        sections: sopDraftSections.map(s=>({heading:s.heading.trim(), body:s.body})),
        fontSize: sopDraftStyle.fontSize, lineHeight: sopDraftStyle.lineHeight,
        updatedAt: new Date().toISOString(), updatedByName: currentUser.displayName||currentUser.email,
      });
      logActivity("sop_updated", "Updated the PMC Examination SOP", null);
      sopEditing = false;
      // Don't rely on the settings/sop onSnapshot to leave edit mode --
      // its optimistic local update can fire while still mid-await above
      // (before sopEditing is set to false), leaving nothing to trigger a
      // second render afterward. Render explicitly instead.
      renderTab();
      toast("SOP saved");
    }catch(err){ console.error(err); toast("Couldn't save ("+err.code+")"); }
  });
}

/* ================= ADMIN TAB ================= */
async function exportAllData(){
  // Fetches a fresh teacher list at export time rather than trusting the
  // cached `allTeachers` global -- that global is only populated once the
  // teachers onSnapshot listener's first (async) callback has fired, so a
  // backup taken in the instant right after opening the Admin tab could
  // otherwise ship with an empty teachers array.
  const btn = document.getElementById("export-data");
  if(btn) btn.disabled = true;
  try{
    const teachersSnap = await getDocs(collection(db,"teachers"));
    const teachers = teachersSnap.docs.map(d=>({email:d.id, ...d.data()}));
    const payload = {
      exportedAt: new Date().toISOString(),
      exportedBy: currentUser.email,
      questions, contests, assignments, teachers, curriculumExtra, dailyLimits,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `pmc-qb-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast("Backup downloaded");
  }catch(err){ console.error(err); toast("Couldn't export data ("+err.code+")"); }
  finally{ if(btn) btn.disabled = false; }
}

// Admin-only editing of an existing curriculumExtra entry (book/chapter/
// subtopic) -- the hardcoded Beast Academy CURRICULUM itself is never
// editable from the UI, only admin-added entries. Each type edits its own
// relevant fields; the write stays a plain updateDoc of the same doc, so
// its id/type/bookId/chapterCode never change, only the human-facing text.
function openCurriculumEditForm(entry){
  const root = document.getElementById("modal-root");
  const fields = entry.type==="book"
    ? `<div class="field"><label>Book name</label><input type="text" id="cx-edit-name" value="${escapeHtml(entry.bookName)}" /></div>
       <div class="field"><label>Applies to level(s)</label>
         <div style="display:flex; gap:10px; flex-wrap:wrap;">${LEVELS.map(l=>`<label style="display:flex; align-items:center; gap:4px; font-weight:400; font-size:12.5px;"><input type="checkbox" class="cx-edit-level" value="${l}" ${(entry.levels||[]).includes(l)?"checked":""}/> ${l}</label>`).join("")}</div>
       </div>`
    : entry.type==="chapter"
    ? `<div class="row2">
         <div class="field"><label>Chapter code <span class="hint">(fixed — existing questions reference it)</span></label><input type="text" value="${escapeHtml(entry.code)}" disabled /></div>
         <div class="field"><label>Chapter title</label><input type="text" id="cx-edit-title" value="${escapeHtml(entry.title)}" /></div>
       </div>
       <div class="field"><label>Subtopics <span class="hint">(comma-separated)</span></label><input type="text" id="cx-edit-subtopics" value="${escapeHtml((entry.subtopics||[]).join(", "))}" /></div>`
    : `<div class="field"><label>Subtopic</label><input type="text" id="cx-edit-subtopic" value="${escapeHtml(entry.subtopic)}" /></div>`;
  root.innerHTML = `<div class="overlay" id="ov"><div class="drawer" style="width:min(480px,100vw);">
    <div class="drawer-head"><h2>Edit ${entry.type}</h2><button class="btn ghost small" id="close-form">Close</button></div>
    ${fields}
    <button class="btn primary" id="cx-edit-save" style="width:100%; justify-content:center; margin-top:10px;">Save</button>
  </div></div>`;
  document.getElementById("close-form").addEventListener("click", closeModal);
  document.getElementById("ov").addEventListener("click", e=>{ if(e.target.id==="ov") closeModal(); });
  document.getElementById("cx-edit-save").addEventListener("click", async ()=>{
    let body = {};
    if(entry.type==="book"){
      const bookName = document.getElementById("cx-edit-name").value.trim();
      const levels = Array.from(document.querySelectorAll(".cx-edit-level:checked")).map(el=>el.value);
      if(!bookName){ toast("Enter a book name"); return; }
      if(levels.length===0){ toast("Pick at least one level"); return; }
      body = {bookName, levels};
    } else if(entry.type==="chapter"){
      const title = document.getElementById("cx-edit-title").value.trim();
      const subtopics = document.getElementById("cx-edit-subtopics").value.split(",").map(s=>s.trim()).filter(Boolean);
      if(!title){ toast("Enter a chapter title"); return; }
      body = {title, subtopics};
    } else {
      const subtopic = document.getElementById("cx-edit-subtopic").value.trim();
      if(!subtopic){ toast("Enter a subtopic name"); return; }
      body = {subtopic};
    }
    try{
      await updateDoc(doc(db,"curriculumExtra",entry.id), body);
      logActivity("curriculum_added", `Edited a curriculum ${entry.type}`, entry.id);
      toast("Saved");
      closeModal();
    }catch(err){ console.error(err); toast("Couldn't save ("+err.code+")"); }
  });
}

    try{
      await addDoc(collection(db,"curriculumExtra"), {type:"book", bookId, bookName, levels, age:"", chapters:[], createdAt:new Date().toISOString(), createdBy:currentUser.email});
      logActivity("curriculum_added", `Added book "${bookName}"`, null);
      toast("Book added — now add chapters to it above");
    }catch(err){ console.error(err); toast("Couldn't add book ("+err.code+")"); }
  });
  document.querySelectorAll("[data-delete-curriculum]").forEach(b=>b.addEventListener("click", async ()=>{
    if(!(await confirmDialog("Remove this curriculum entry? Any questions already tagged with it keep their tag, but it won't be pickable anymore.", {danger:true}))) return;
    try{
      await deleteDoc(doc(db,"curriculumExtra",b.dataset.deleteCurriculum));
      logActivity("curriculum_removed", `Removed a curriculum entry`, b.dataset.deleteCurriculum);
      toast("Removed");
    }catch(err){ toast("Couldn't remove entry"); }
  }));
  document.querySelectorAll("[data-edit-curriculum]").forEach(b=>b.addEventListener("click", ()=>{
    const entry = curriculumExtra.find(e=>e.id===b.dataset.editCurriculum);
    if(entry) openCurriculumEditForm(entry);
  }));
  document.getElementById("add-teacher-btn").addEventListener("click", addTeacher);
  document.getElementById("gen-password-btn").addEventListener("click", ()=>{
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
    let pw = ""; for(let i=0;i<10;i++) pw += chars[Math.floor(Math.random()*chars.length)];
    document.getElementById("new-teacher-password").value = pw;
  });
  subscribeTeachers();
}

const ACTIVITY_ICON = {
  question_created:"📝", question_updated:"✏️", question_status_changed:"🔄", question_deleted:"🗑",
  tag_removed:"🏷️", teacher_added:"➕", teacher_role_changed:"🔁", teacher_removed:"➖",
  assignment_created:"📋", assignment_updated:"📋", assignment_deleted:"🗑",
  curriculum_added:"📚", curriculum_removed:"📚",
  contest_created:"🏆", contest_updated:"🏆", contest_deleted:"🗑", contest_quilgo_complete:"✅",
  review_assigned:"🔍", review_submitted:"✔️", limits_updated:"⚙️", sop_updated:"📄",
};
function subscribeActivityLog(){
  if(unsubActivityLog) return;
  const q = query(collection(db,"activityLog"), orderBy("createdAt","desc"), limit(150));
  unsubActivityLog = onSnapshot(q, snap=>{
    activityLogEntries = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderActivityLog();
  }, err=>{ console.error(err); });
}
function renderActivityLog(){
  const wrap = document.getElementById("activity-log-wrap");
  if(!wrap) return;
  wrap.innerHTML = activityLogEntries.length===0 ? emptyState("No activity recorded yet.") :
    `<div class="activity-log">${activityLogEntries.map(a=>`
      <div class="activity-row">
        <span class="activity-icon">${ACTIVITY_ICON[a.type]||"•"}</span>
        <span class="activity-summary">${escapeHtml(a.summary)}</span>
        <span class="activity-meta mono">${escapeHtml(a.actorName||a.actorEmail||"—")} · ${fmtDate(a.createdAt)}</span>
      </div>`).join("")}</div>`;
}

  tbody.innerHTML = list.map(t=>`
    <tr>
      <td data-name-cell>${escapeHtml(t.name||"—")} <button type="button" class="link-btn" data-edit-name="${escapeHtml(t.email)}" title="Edit name" style="margin-left:2px;">✎</button></td>
      <td>${escapeHtml(t.email)}</td>
      <td><span class="pill role-${t.role}">${ROLE_LABEL[t.role]||t.role}</span></td>
      <td class="mono">${t.addedAt? fmtDate(t.addedAt): "—"}</td>
      <td style="white-space:nowrap; display:flex; gap:6px; align-items:center;">
        <select data-role-select="${escapeHtml(t.email)}" style="padding:4px 6px; font-size:12px;">
          ${Object.keys(ROLE_LABEL).map(r=>`<option value="${r}" ${t.role===r?"selected":""}>${ROLE_LABEL[r]}</option>`).join("")}
        </select>
        <button class="btn small" data-reset-password="${escapeHtml(t.email)}">Reset password</button>
        <button class="btn small" style="color:var(--red);" data-remove-teacher="${escapeHtml(t.email)}">Remove</button>
      </td>
    </tr>`).join("");
  tbody.querySelectorAll("[data-reset-password]").forEach(b=>b.addEventListener("click", ()=>resetTeacherPassword(b.dataset.resetPassword)));
  tbody.querySelectorAll("[data-role-select]").forEach(sel=>sel.addEventListener("change", ()=>setTeacherRole(sel.dataset.roleSelect, sel.value, sel)));
  tbody.querySelectorAll("[data-remove-teacher]").forEach(b=>b.addEventListener("click", ()=>removeTeacher(b.dataset.removeTeacher)));
  // Inline rename -- the only way a teacher's display name was ever set was
  // typing it once into "Full name" at account-creation time (addTeacher()
  // below); an account created before that field existed, or left blank,
  // had no way to fix it afterward, so every t.name||t.email fallback
  // across the app (Assignment Kanban columns, Team/By-teacher chart
  // labels, reassign dropdowns) permanently showed the raw email instead.
  tbody.querySelectorAll("[data-edit-name]").forEach(b=>b.addEventListener("click", ()=>{
    const email = b.dataset.editName;
    const td = b.closest("tr").querySelector("[data-name-cell]");
    const current = list.find(t=>t.email===email)?.name || "";
    td.innerHTML = `<input type="text" value="${escapeHtml(current)}" style="padding:4px 6px; font-size:12px; width:150px;" /> <button type="button" class="btn small primary" data-save-name>Save</button>`;
    const input = td.querySelector("input");
    input.focus(); input.select();
    const save = async ()=>{
      const newName = input.value.trim();
      try{
        await updateDoc(doc(db,"teachers",email), {name: newName || null});
        logActivity("teacher_updated", `Updated name for ${email}`, email);
        toast("Name updated");
      }catch(err){ console.error(err); toast("Couldn't update name"); }
    };
    td.querySelector("[data-save-name]").addEventListener("click", save);
    input.addEventListener("keydown", e=>{ if(e.key==="Enter") save(); });
  }));
}

async function addTeacher(){
  const nameInput = document.getElementById("new-teacher-name");
  const emailInput = document.getElementById("new-teacher-email");
  const passwordInput = document.getElementById("new-teacher-password");
  const name = nameInput.value.trim();
  const email = emailInput.value.trim().toLowerCase();
  const password = passwordInput.value;
  const role = document.getElementById("new-teacher-role").value;
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast("Enter a valid email"); return; }
  if(password.length < 6){ toast("Password must be at least 6 characters"); return; }
  const btn = document.getElementById("add-teacher-btn");
  btn.disabled = true;
  // Create the login on a throwaway secondary Firebase app instance so it
  // doesn't sign the admin out of their own session (creating a user with
  // the client SDK signs in as that user on whichever app instance did it).
  const secondaryApp = initializeApp(window.FIREBASE_CONFIG, "Secondary-"+Date.now());
  const secondaryAuth = getAuth(secondaryApp);
  try{
    const cred = await createUserWithEmailAndPassword(secondaryAuth, email, password);
    if(name) await updateProfile(cred.user, {displayName:name});
    await setDoc(doc(db,"teachers",email), {
      role, name: name || null, addedBy: currentUser.email, addedAt: new Date().toISOString()
    });
    logActivity("teacher_added", `Created ${ROLE_LABEL[role]||role} account for ${email}`, email);
    toast("Account created for "+email);
    nameInput.value = ""; emailInput.value = ""; passwordInput.value = "";
  }catch(err){
    console.error(err);
    toast("Couldn't create account: "+err.code);
  }finally{
    await signOut(secondaryAuth).catch(()=>{});
    await deleteApp(secondaryApp).catch(()=>{});
    btn.disabled = false;
  }
}

async function setTeacherRole(email, newRole, selectEl){
  const isSelf = email===currentUser.email.toLowerCase();
  if(isSelf && newRole!=="admin" &&
     !(await confirmDialog("This is your own account — you'll lose admin access immediately. Continue?", {danger:true}))){
    selectEl.value = "admin";
    return;
  }
  try{
    await setDoc(doc(db,"teachers",email), {role:newRole}, {merge:true});
    logActivity("teacher_role_changed", `Set ${email}'s role to ${ROLE_LABEL[newRole]}`, email);
    toast(`Role updated to ${ROLE_LABEL[newRole]}`);
    // Own role/session state is only set once at sign-in -- refresh it
    // immediately on self-change so admin-only UI doesn't keep showing
    // after you've just removed your own access to it.
    if(isSelf) checkTeacherStatus();
  }catch(err){ console.error(err); toast("Couldn't update role ("+err.code+")"); }
}

async function resetTeacherPassword(email){
  // The client SDK has no way for an admin to directly set someone else's
  // password without a backend (Admin SDK) — this sends them the same
  // "Forgot password" reset email teachers can trigger for themselves.
  if(!(await confirmDialog(`Send a password reset email to ${email}?`))) return;
  try{
    await sendPasswordResetEmail(auth, email);
    toast("Password reset email sent to "+email);
  }catch(err){ console.error(err); toast("Couldn't send reset email ("+err.code+")"); }
}

async function removeTeacher(email){
  const self = email===currentUser.email.toLowerCase();
  if(!(await confirmDialog(self ? "This is your own account — removing it will revoke your own access immediately. Continue?" : `Remove access for ${email}?`, {danger:true}))) return;
  try{
    await deleteDoc(doc(db,"teachers",email));
    logActivity("teacher_removed", `Removed access for ${email}`, email);
    toast("Access removed");
    if(self) checkTeacherStatus();
  }catch(err){ console.error(err); toast("Couldn't remove teacher ("+err.code+")"); }
}

function qualityLabel(p,d){
  if(d===null||isNaN(d)) return {v:"fair", l:"—"};
  if(d>=0.40) return {v:"excellent", l:"Excellent"};
  if(d>=0.30) return {v:"good", l:"Good"};
  if(d>=0.20) return {v:"fair", l:"Fair / Marginal"};
  return {v:"ambiguous", l:"Poor / Highly Ambiguous"};
}

function renderStatForm(qid){
  const wrap = document.getElementById("stat-form-wrap");
  wrap.innerHTML = `
    <div class="level-block">
      <div class="row2">
        <div class="field"><label>Total attempts</label><input type="number" min="0" id="s-total" /></div>
        <div class="field"><label>Total correct</label><input type="number" min="0" id="s-correct" /></div>
        <div class="field"><label>Top-group (top ~27%) count</label><input type="number" min="0" id="s-topn" /></div>
        <div class="field"><label>Top-group correct</label><input type="number" min="0" id="s-topc" /></div>
        <div class="field"><label>Bottom-group (bottom ~27%) count</label><input type="number" min="0" id="s-botn" /></div>
        <div class="field"><label>Bottom-group correct</label><input type="number" min="0" id="s-botc" /></div>
      </div>
      <button class="btn primary" id="save-stats">Compute &amp; save</button>
      <span id="stat-preview" class="mono" style="margin-left:12px; font-size:12.5px;"></span>
    </div>`;
  document.getElementById("save-stats").addEventListener("click", async ()=>{
    const total = parseFloat(document.getElementById("s-total").value);
    const correct = parseFloat(document.getElementById("s-correct").value);
    const topN = parseFloat(document.getElementById("s-topn").value);
    const topC = parseFloat(document.getElementById("s-topc").value);
    const botN = parseFloat(document.getElementById("s-botn").value);
    const botC = parseFloat(document.getElementById("s-botc").value);
    if([total,correct,topN,topC,botN,botC].some(v=>isNaN(v)||v<0) || total<=0 || topN<=0 || botN<=0){ toast("Fill in all fields with valid numbers"); return; }
    const p = correct/total;
    const d = (topC/topN) - (botC/botN);
    const ql = qualityLabel(p,d);
    document.getElementById("stat-preview").textContent = `p = ${p.toFixed(2)} · D = ${d.toFixed(2)} · ${ql.l}`;
    try{
      await setDoc(doc(db,"questions",qid,"stats","post_test"), {
        attempts:total, correct, topN, topCorrect:topC, botN, botCorrect:botC,
        pValue:p, discrimination:d, qualityLabel:ql.l, qualityKey:ql.v,
        enteredBy: currentUser.displayName||currentUser.email, updatedAt:new Date().toISOString()
      });
      toast("Statistics saved"); loadAllStats();
    }catch(err){ console.error(err); toast("Couldn't save statistics"); }
  });
}

async function loadAllStats(){
  const tbody = document.getElementById("stats-tbody");
  if(!tbody) return;
  const rows = [];
  // One collection-group read across every question's stats subcollection,
  // instead of one getDoc per locked question -- same rule already covers
  // it (allow read: if isTeacher() on questions/{id}/stats/{id}), no index
  // needed since this query has no filter/orderBy.
  try{
    const snap = await getDocs(collectionGroup(db,"stats"));
    snap.forEach(d=>{
      if(d.id!=="post_test") return;
      const q = questions.find(x=>x.id===d.ref.parent.parent.id);
      if(q && (q.status==="finalized"||q.status==="uploaded")) rows.push({q, d:d.data()});
    });
  }catch(e){ console.error(e); }
  if(!document.getElementById("stats-tbody")) return;
  if(rows.length===0){ tbody.innerHTML = `<tr><td colspan="6" class="hint" style="padding:14px;">No post-test statistics entered yet.</td></tr>`; return; }
  rows.sort((a,b)=> (a.d.discrimination??0) - (b.d.discrimination??0));
  tbody.innerHTML = rows.map(({q,d})=>`
    <tr>
      <td>${escapeHtml(q.titleEn)}</td><td>${(q.level||[]).join(", ")}</td>
      <td class="mono">${d.pValue!=null? d.pValue.toFixed(2):"—"}</td>
      <td class="mono">${d.discrimination!=null? d.discrimination.toFixed(2):"—"}</td>
      <td><span class="quality ${d.qualityKey}">${d.qualityLabel}</span></td>
      <td class="mono">${d.attempts??"—"}</td>
    </tr>`).join("");
}
